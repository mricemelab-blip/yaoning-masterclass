<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arise 发声俱乐部 - Arise Voice Club 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#141414;--border:#1e1e1e;--gold:#C5A55A;--gold-dim:rgba(197,165,90,.15);--text:#e8e8e8;--text-muted:#888;--danger:#d94040}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.container{width:100%;max-width:380px}
.brand{text-align:center;margin-bottom:40px}
.brand h1{font-size:28px;font-weight:700;letter-spacing:2px;color:var(--gold);margin-bottom:6px}
.brand p{font-size:13px;color:var(--text-muted);letter-spacing:4px;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px 28px 28px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;letter-spacing:.5px}
.field input{width:100%;height:44px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 14px;font-size:15px;color:var(--text);outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--gold)}
.field input::placeholder{color:#555}
.btn{width:100%;height:46px;background:var(--gold);color:#0a0a0a;font-size:15px;font-weight:600;border:none;border-radius:8px;cursor:pointer;letter-spacing:1px;transition:opacity .2s;margin-top:6px}
.btn:hover{opacity:.88}
.btn:active{opacity:.76}
.error{color:var(--danger);font-size:13px;text-align:center;margin-top:14px;min-height:20px}
.footer{text-align:center;margin-top:32px}
.footer a{color:var(--text-muted);font-size:13px;text-decoration:none;transition:color .2s}
.footer a:hover{color:var(--gold)}
.tagline{text-align:center;margin-bottom:36px;font-size:14px;color:var(--text-muted);letter-spacing:1px;line-height:1.7}
.tagline span{color:var(--gold)}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <h1>Arise 发声俱乐部</h1>
    <p>Arise Voice Club</p>
  </div>
  <p class="tagline">每一次发声，都是<span>重塑自我</span>的开始</p>
  <div class="card">
    <div class="field">
      <label for="nameInput">姓名</label>
      <input type="text" id="nameInput" placeholder="请输入你的姓名" autocomplete="name">
    </div>
    <div class="field">
      <label for="codeInput">邀请码</label>
      <input type="text" id="codeInput" placeholder="请输入邀请码" autocomplete="off" style="text-transform:uppercase">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">进入学习中心</button>
    <div class="error" id="errorBox"></div>
  </div>
  <div class="footer">
    <a href="../index.html">← 返回大师课系列</a>
  </div>
</div>
<script>
var CODES = {
  'VC2026A': { name: '学员A', id: 'vc001' },
  'VC2026B': { name: '学员B', id: 'vc002' },
  'VC2026C': { name: '学员C', id: 'vc003' },
  'COACH':   { name: '教练',   id: 'coach', isCoach: true }
};

(function init() {
  if (localStorage.getItem('vc_role')) {
    window.location.href = 'app.html';
  }
})();

function doLogin() {
  var name = document.getElementById('nameInput').value.trim();
  var code = document.getElementById('codeInput').value.trim().toUpperCase();
  var err  = document.getElementById('errorBox');
  err.textContent = '';
  if (!name) { err.textContent = '请输入姓名'; return; }
  if (!code) { err.textContent = '请输入邀请码'; return; }
  var user = CODES[code];
  if (!user) { err.textContent = '邀请码无效，请检查后重试'; return; }
  localStorage.setItem('vc_name', name);
  localStorage.setItem('vc_user_id', user.id);
  localStorage.setItem('vc_role', user.isCoach ? 'coach' : 'student');
  localStorage.setItem('vc_invite_code', code);
  window.location.href = 'app.html';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
