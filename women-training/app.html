<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>训练主页 — 8周女性训练</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--gold:#C5A55A;--gold-dim:rgba(197,165,90,.15);--text:#fff;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.35);--green:#22C55E;--red:#EF4444;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(197,165,90,.05) 0%,transparent 60%);pointer-events:none;z-index:0}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-size:18px;font-weight:800;color:var(--gold);letter-spacing:1px}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-week{font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-dim);padding:4px 12px;border-radius:20px;letter-spacing:1px}
.nav-user{font-size:13px;color:var(--text2)}
.nav-logout{font-size:12px;color:var(--text3);text-decoration:none;padding:4px 10px;border:1px solid var(--border);border-radius:6px;transition:all .2s}
.nav-logout:hover{color:var(--gold);border-color:var(--gold)}

/* REPORT */
.report-section{margin-bottom:16px}
.report-section .card-title{margin-bottom:14px}
.rf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.rf-field label{display:block;font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.rf-field input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.03);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
.rf-field input[type=number]:focus{border-color:var(--gold)}
.rf-range{display:flex;align-items:center;gap:8px}
.rf-range input[type=range]{flex:1;-webkit-appearance:none;background:transparent;padding:4px 0}
.rf-range input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:2px}
.rf-range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);margin-top:-7px;cursor:pointer}
.rf-val{font-size:14px;color:var(--gold);font-weight:700;min-width:20px;text-align:center}
.rf-btn{width:100%;padding:10px;border:none;border-radius:8px;background:var(--gold);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:1px;transition:background .2s;margin-top:14px}
.rf-btn:hover{background:#B8960C}
.rf-saved{font-size:12px;color:var(--green);margin-top:6px;text-align:center}
.rf-note{font-size:11px;color:var(--text3);margin-top:4px}
.rc-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:16px}
.rc{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:3px solid var(--border);transition:border-color .3s}
.rc .rc-num{font-size:28px;font-weight:800;line-height:1}
.rc .rc-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.rc.g{border-color:var(--green);color:var(--green)}
.rc.y{border-color:#EAB308;color:#EAB308}
.rc.r{border-color:var(--red);color:var(--red)}
.rc.na{border-color:var(--border);color:var(--text3)}
.rb{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rb-lbl{font-size:12px;color:var(--text2);min-width:56px;font-weight:600}
.rbg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.rf{height:100%;border-radius:3px;transition:width .4s}
.rf.g{background:var(--green)}.rf.y{background:#EAB308}.rf.r{background:var(--red)}.rf.na{background:var(--text3)}
.rb-val{font-size:12px;color:var(--text2);min-width:32px;text-align:right;font-weight:600}
.rd-status{text-align:center;font-size:13px;font-weight:700;margin-top:4px;letter-spacing:1px}
.rd-dehyd{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:12px;color:var(--text2)}
.rd-dehyd strong{color:var(--gold)}
.rd-dehyd .dehyd-warn{color:var(--red);font-weight:700}

/* WEEK BAR */
.week-bar{display:flex;gap:6px;padding:16px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.week-btn{flex-shrink:0;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:1px;border:1.5px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .25s}
.week-btn.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.week-btn.done{border-color:rgba(197,165,90,.4);color:var(--gold)}

/* SCENE TOGGLE */
.scene-toggle{display:flex;gap:0;margin:0 20px 16px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);position:relative;z-index:1}
.scene-btn{flex:1;padding:12px;font-size:14px;font-weight:700;letter-spacing:1px;border:none;background:transparent;color:var(--text3);cursor:pointer;transition:all .25s;font-family:inherit}
.scene-btn.active{background:var(--gold-dim);color:var(--gold)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin:0 20px;position:relative;z-index:1}
.tab-btn{flex:1;padding:12px 0;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);background:none;border:none;cursor:pointer;position:relative;transition:color .2s;font-family:inherit}
.tab-btn.active{color:var(--gold)}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:var(--gold);border-radius:1px}

/* CONTENT */
.content{padding:20px;position:relative;z-index:1;max-width:720px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700;margin-bottom:8px}
.card p{font-size:14px;color:var(--text2);line-height:1.6}

/* PHASE BADGE */
.phase-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:12px}
.phase-1{background:rgba(59,130,246,.15);color:#60A5FA}
.phase-2{background:rgba(197,165,90,.15);color:var(--gold)}
.phase-3{background:rgba(239,68,68,.15);color:#F87171}

/* DAY CARDS */
.day-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px}
.day-label{flex-shrink:0;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:0}
.day-mon{background:rgba(197,165,90,.12);color:var(--gold)}
.day-tue{background:rgba(59,130,246,.12);color:#60A5FA}
.day-wed{background:rgba(34,197,94,.12);color:#22C55E}
.day-thu{background:rgba(168,85,247,.12);color:#A855F7}
.day-fri{background:rgba(249,115,22,.12);color:#F97316}
.day-sat{background:rgba(236,72,153,.12);color:#EC4899}
.day-sun{background:rgba(255,255,255,.06);color:var(--text3)}
.day-info{flex:1;min-width:0}
.day-info h4{font-size:14px;font-weight:700;margin-bottom:2px}
.day-info p{font-size:12px;color:var(--text3)}
.day-check{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:transparent;transition:all .2s;margin-top:6px}
.day-check.done{border-color:var(--green);background:rgba(34,197,94,.15);color:var(--green)}

/* EXERCISE */
.exercise{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px}
.ex-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.ex-name{font-size:15px;font-weight:700}
.ex-sets{font-size:13px;color:var(--gold);font-weight:600;white-space:nowrap;margin-left:12px}
.ex-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ex-tag{font-size:11px;font-weight:600;padding:2px 10px;border-radius:4px;letter-spacing:.5px}
.tag-mode-flex{background:rgba(59,130,246,.12);color:#60A5FA}
.tag-mode-stab{background:rgba(34,197,94,.12);color:#22C55E}
.tag-mode-perf{background:rgba(249,115,22,.12);color:#F97316}
.tag-rest{background:rgba(255,255,255,.06);color:var(--text3)}
.ex-note{font-size:12px;color:var(--text3);margin-top:6px}

/* POST-WORKOUT LOG */
.ex-log-toggle{margin-top:8px;padding:4px 0;border:none;background:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;transition:color .2s}
.ex-log-toggle:hover{color:var(--gold)}
.ex-log-panel{max-height:0;overflow:hidden;transition:max-height .3s ease}
.ex-log-panel.open{max-height:500px}
.ex-log-form{padding:10px 0 4px;border-top:1px solid var(--border);margin-top:8px}
.ex-log-sets{margin-bottom:8px}
.ex-log-set{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px}
.ex-log-set label{color:var(--text3);min-width:32px;font-weight:600}
.ex-log-set input{width:56px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.03);color:var(--text);font-size:13px;text-align:center;font-family:inherit;outline:none}
.ex-log-set input:focus{border-color:var(--gold)}
.ex-log-set .unit{color:var(--text3);font-size:11px}
.ex-log-rpe{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px}
.ex-log-rpe label{color:var(--text3);font-weight:600}
.ex-log-rpe select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.03);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.ex-log-save{padding:6px 16px;border:none;border-radius:6px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:background .2s}
.ex-log-save:hover{background:#B8960C}
.ex-log-saved{font-size:11px;color:var(--green);margin-top:4px}

/* PROGRESS TAB */
.progress-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.progress-card .card-title{margin-bottom:10px}
.progress-stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.progress-stat{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.progress-stat .ps-val{font-size:22px;font-weight:800;color:var(--gold)}
.progress-stat .ps-label{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.chart-container{width:100%;overflow:hidden}
.chart-container svg{width:100%;height:auto}
.chart-label{font-size:11px;fill:var(--text3);font-family:inherit}
.chart-line{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart-dot{fill:var(--gold);stroke:var(--bg);stroke-width:2}
.chart-area{fill:rgba(197,165,90,.08)}
.chart-grid{stroke:var(--border);stroke-width:0.5}
.chart-date{font-size:9px;fill:var(--text3);font-family:inherit}
.progress-empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}

/* PRINCIPLE */
.principle{background:linear-gradient(135deg,rgba(197,165,90,.08),rgba(197,165,90,.02));border:1px solid rgba(197,165,90,.2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.principle h4{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:1px;margin-bottom:8px}
.principle p{font-size:13px;color:var(--text2);line-height:1.6}

/* CHECKIN BUTTON */
.checkin-btn{width:100%;padding:16px;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .25s;font-family:inherit;margin-top:20px}
.checkin-btn.pending{background:var(--gold);color:#fff}
.checkin-btn.pending:hover{background:#B8960C}
.checkin-btn.completed{background:rgba(34,197,94,.12);color:var(--green);border:1.5px solid rgba(34,197,94,.3);cursor:default}

/* NUTRITION */
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.macro-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.macro-val{font-size:24px;font-weight:800;color:var(--gold)}
.macro-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.meal-plan{margin-top:16px}
.meal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.meal-row:last-child{border-bottom:none}
.meal-name{font-weight:700;color:var(--text)}
.meal-detail{color:var(--text3);text-align:right;max-width:55%}

/* SUPPLEMENT */
.supp-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px}
.supp-header{display:flex;justify-content:space-between;align-items:center}
.supp-name{font-size:15px;font-weight:700}
.supp-evidence{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.5px}
.evidence-a{background:rgba(34,197,94,.15);color:#22C55E}
.evidence-b{background:rgba(197,165,90,.15);color:var(--gold)}
.evidence-c{background:rgba(255,255,255,.08);color:var(--text3)}
.supp-detail{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px}
.supp-detail dt{color:var(--text3)}
.supp-detail dd{color:var(--text2)}
.supp-note{font-size:12px;color:var(--text3);margin-top:8px;font-style:italic}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty h3{font-size:16px;margin-bottom:8px;color:var(--text2)}

/* RESPONSIVE */
@media(max-width:480px){
.content{padding:16px}
.card{padding:18px}
.macro-grid{grid-template-columns:1fr 1fr}
.scene-toggle{margin:0 16px 12px}
.week-bar{padding:12px 16px}
.tabs{margin:0 16px}
.nav{padding:0 16px}
.nav-user{display:none}
.rf-grid{grid-template-columns:1fr 1fr}
.progress-stat-row{grid-template-columns:1fr 1fr}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(197,165,90,.2);border-radius:2px}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-brand">8 周女性训练</div>
  <div class="nav-right">
    <span class="nav-week" id="navWeek"></span>
    <span class="nav-user" id="navUser"></span>
    <a href="login.html" class="nav-logout" onclick="doLogout()">退出</a>
  </div>
</nav>

<!-- WEEK BAR -->
<div class="week-bar" id="weekBar"></div>

<!-- SCENE TOGGLE -->
<div class="scene-toggle" id="sceneToggle">
  <button class="scene-btn active" data-scene="gym" onclick="setScene('gym')">🏋️ 健身房</button>
  <button class="scene-btn" data-scene="home" onclick="setScene('home')">🏠 居家</button>
</div>

<!-- TABS -->
<div class="tabs" id="tabBar">
  <button class="tab-btn" data-tab="overview" onclick="setTab('overview')">Overview</button>
  <button class="tab-btn" data-tab="today" onclick="setTab('today')">Today</button>
  <button class="tab-btn" data-tab="report" onclick="setTab('report')">Report</button>
  <button class="tab-btn" data-tab="nutrition" onclick="setTab('nutrition')">Nutrition</button>
  <button class="tab-btn" data-tab="supplements" onclick="setTab('supplements')">Supplements</button>
  <button class="tab-btn" data-tab="progress" onclick="setTab('progress')">Progress</button>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="tab-panel active" id="panel-overview"></div>
  <div class="tab-panel" id="panel-today"></div>
  <div class="tab-panel" id="panel-report"></div>
  <div class="tab-panel" id="panel-nutrition"></div>
  <div class="tab-panel" id="panel-supplements"></div>
  <div class="tab-panel" id="panel-progress"></div>
</div>

<script>
// ===== STATE =====
var state = {
  role: localStorage.getItem('wt_role'),
  userId: localStorage.getItem('wt_user_id'),
  userName: localStorage.getItem('wt_user_name'),
  profile: null,
  currentWeek: 1,
  currentScene: localStorage.getItem('wt_scene') || 'gym',
  currentTab: 'overview',
  checkins: JSON.parse(localStorage.getItem('wt_checkins') || '{}')
};

if (!state.role) { window.location.href = 'login.html'; }

try { state.profile = JSON.parse(localStorage.getItem('wt_profile') || '{}'); } catch(e) { state.profile = {}; }

// Start date
if (!localStorage.getItem('wt_start_date')) {
  localStorage.setItem('wt_start_date', new Date().toISOString().slice(0,10));
}
var startDate = new Date(localStorage.getItem('wt_start_date'));

// ===== TRAINING DATA =====
var TRAINING = {
  phase1: {
    name: 'Phase 1 · 动作奠基',
    weeks: [1,2],
    cls: 'phase-1',
    intensity: 'RPE 6-7 / RIR 3 / ~60-65% 1RM',
    goal: '建立正确动作模式，激活目标肌群，适应训练负荷',
    nutrition: '维持热量 (TDEE)'
  },
  phase2: {
    name: 'Phase 2 · 渐进加载',
    weeks: [3,4,5],
    cls: 'phase-2',
    intensity: 'RPE 7-8 / RIR 1-2',
    goal: '逐步增加负荷，发展力量基础，提升骨密度刺激',
    nutrition: '维持或轻度减脂 (TDEE × 0.9)'
  },
  phase3: {
    name: 'Phase 3 · 重负荷骨密度',
    weeks: [6,7,8],
    cls: 'phase-3',
    intensity: 'RPE 8-9 / RIR 0-1',
    goal: '高负荷骨骼加载，最大化骨密度适应，力量峰值',
    nutrition: '微盈余增肌 (TDEE × 1.1)'
  }
};

function getPhase(w) {
  if (w <= 2) return TRAINING.phase1;
  if (w <= 5) return TRAINING.phase2;
  return TRAINING.phase3;
}

// --- PHASE 1 (W1-2) ---
var P1 = {
  gym: {
    'Lower A': {
      day: '周一', focus: '蹲 + 铰链',
      exercises: [
        { name: '脊椎波浪 + 毛毛虫', sets: '2×8', rest: '—', mode: 'flex', note: '热身激活，逐节活动脊椎', type: '热身' },
        { name: '分腿蹲 DB Split Squat', sets: '3×10', rest: '60s', mode: 'flex', note: '主项，控制膝关节追踪方向，重心在前脚跟', type: '主项' },
        { name: '分腿硬拉 Split Stance DL', sets: '3×10', rest: '60s', mode: 'flex', note: '铰链模式，感受腘绳肌离心拉伸', type: '主项' },
        { name: '保加利亚蹲 Bulgarian SS', sets: '2×8/侧', rest: '60s', mode: 'flex', note: '单侧强化，后脚放凳面', type: '辅项' },
        { name: 'Hollow 保持', sets: '3×20s', rest: '30s', mode: 'stab', note: '骨盆后倾，腰椎压实地面', type: '稳定' }
      ]
    },
    'Upper A': {
      day: '周二', focus: '推 + 拉',
      exercises: [
        { name: '释手俯卧撑', sets: '2×10', rest: '—', mode: 'flex', note: '热身，每组底部完全释手再推起', type: '热身' },
        { name: '死虫卧推 DB Dead Bug Press', sets: '3×8', rest: '60s', mode: 'flex', note: '仰卧交替推举，腰椎保持中立', type: '主项' },

// ===== FUNCTIONS =====
function calcWeek() {
  var now = new Date();
  var diff = Math.floor((now - startDate) / (7*24*60*60*1000));
  return Math.max(1, Math.min(8, diff + 1));
}

function getDayOfWeek() {
  var d = new Date().getDay();
  return d; // 0=Sun,1=Mon,...,6=Sat
}

function getPhaseData(w, scene) {
  if (w === 8) return P3_TEST[scene];
  var pool = w <= 2 ? P1 : (w <= 5 ? P2 : P3);
  return pool[scene];
}

var DAY_MAP = { 1: 'Lower A', 2: 'Upper A', 3: 'Cardio', 4: 'Lower B', 5: 'Upper B', 6: 'Saturday', 0: 'Rest' };

function getTodayKey() {
  return DAY_MAP[getDayOfWeek()];
}

function getCheckinKey(w, dayOfWeek) {
  return 'w' + w + 'd' + dayOfWeek;
}

function isCheckinDone(w, dayOfWeek) {
  return !!state.checkins[getCheckinKey(w, dayOfWeek)];
}

function toggleCheckin(w, dayOfWeek) {
  var key = getCheckinKey(w, dayOfWeek);
  if (state.checkins[key]) {
    delete state.checkins[key];
  } else {
    state.checkins[key] = { time: new Date().toISOString() };
  }
  localStorage.setItem('wt_checkins', JSON.stringify(state.checkins));
  state.checkins = JSON.parse(localStorage.getItem('wt_checkins') || '{}');
}

// ===== REPORT =====
function getTodayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getReportData() {
  var key = 'wt_report_' + getTodayStr();
  try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; }
}

function saveReportData(data) {
  var key = 'wt_report_' + getTodayStr();
  localStorage.setItem(key, JSON.stringify(data));
}

function calcHrvScore(hrv) {
  if (hrv === null || hrv === undefined) return null;
  if (hrv >= 60) return 100;
  if (hrv >= 40) return 60 + (hrv - 40) * 2;
  if (hrv >= 20) return 30 + (hrv - 20) * 1.5;
  return Math.max(0, hrv * 1.5);
}

function calcReadiness(d) {
  if (!d) return null;
  var hrv = d.hrv, sleep = d.sleepQuality, pain = d.pain, appetite = d.appetite;
  var hrvS = calcHrvScore(hrv);
  var sleepS = (sleep !== null && sleep !== undefined) ? sleep * 20 : null;
  var painS = (pain !== null && pain !== undefined) ? (10 - pain) * 10 : null;
  var appS = (appetite !== null && appetite !== undefined) ? appetite * 20 : null;
  var scores = [];
  var weights = [];
  if (hrvS !== null) { scores.push(hrvS); weights.push(0.35); }
  if (sleepS !== null) { scores.push(sleepS); weights.push(0.30); }
  if (painS !== null) { scores.push(painS); weights.push(0.20); }
  if (appS !== null) { scores.push(appS); weights.push(0.15); }
  if (scores.length === 0) return null;
  var totalW = 0;
  var totalS = 0;
  for (var i = 0; i < scores.length; i++) { totalS += scores[i] * weights[i]; totalW += weights[i]; }
  return { total: Math.round(totalS / totalW), hrv: hrvS, sleep: sleepS, pain: painS, appetite: appS };
}

function readinessClass(v) {
  if (v === null) return 'na';
  if (v >= 70) return 'g';
  if (v >= 40) return 'y';
  return 'r';
}

function readinessLabel(v) {
  if (v === null) return 'No Data';
  if (v >= 70) return 'Good';
  if (v >= 40) return 'Moderate';
  return 'Poor';
}

  h += '<div class="rf-field"><label>练后体重 (kg)</label><input type="number" id="rPostWeight" step="0.1" min="30" max="200" placeholder="62.5" value="' + (d.postWeight || '') + '"></div>';
  h += '<div class="rf-field"><label>RPE (1-10)</label><div class="rf-range"><input type="range" id="rRPE" min="1" max="10" value="' + (d.rpe || 5) + '" oninput="document.getElementById(\'rRPEV\').textContent=this.value"><span class="rf-val" id="rRPEV">' + (d.rpe || 5) + '</span></div></div>';

  // Dehydration estimate
  if (d.preWeight && d.postWeight) {
    var dehyd = ((d.preWeight - d.postWeight) / d.preWeight * 100).toFixed(1);
    var dehydClass = parseFloat(dehyd) > 2 ? 'dehyd-warn' : '';
    h += '<div class="rd-dehyd">脱水估算：<strong>' + dehyd + '%</strong>';
    if (parseFloat(dehyd) > 0) {
      var waterNeed = Math.round(Math.abs(parseFloat(dehyd)) * 10 * (d.preWeight || 60));
      h += '<br>每1%脱水≈需补充10ml/kg水，建议补液约 <strong>' + waterNeed + 'ml</strong>';

    h += '</div>';
  }
  var postDone = d.postWeight || d.rpe || d.duration;
  h += '<button class="rf-btn" onclick="savePostWorkout()">' + (postDone ? '更新数据' : '保存练后数据') + '</button>';
  h += '<div class="rf-saved" id="rPostSaved" style="display:none">✓ 已保存</div>';
  h += '</div>';

  document.getElementById('panel-report').innerHTML = h;

// ===== POST-WORKOUT LOG =====
function getLogKey() {
  return 'wt_log_W' + state.currentWeek + '_' + getTodayKey();
}

function getLogData() {
  try { return JSON.parse(localStorage.getItem(getLogKey())) || {exercises:{}}; } catch(e) { return {exercises:{}}; }
}

function saveLogData(data) {
  localStorage.setItem(getLogKey(), JSON.stringify(data));
}

function toggleExLog(exName) {
  var el = document.getElementById('logpanel-' + exName);
  if (el) el.classList.toggle('open');
}

function saveExLog(exName) {
  var data = getLogData();
  var container = document.getElementById('logform-' + exName);
  if (!container) return;
  var setEls = container.querySelectorAll('.ex-log-set');
  var sets = [];
  setEls.forEach(function(s) {
    var w = parseFloat(s.querySelector('.log-weight').value) || 0;
    var r = parseInt(s.querySelector('.log-reps').value) || 0;
    sets.push({weight: w, reps: r});
  });
  var rpe = parseInt(container.querySelector('.log-rpe').value) || 5;
  data.exercises[exName] = { sets: sets, rpe: rpe };
  saveLogData(data);
  var savedEl = container.querySelector('.ex-log-saved');
  if (savedEl) {
    savedEl.textContent = '✓ 已保存';
    savedEl.style.display = 'block';
    setTimeout(function(){ savedEl.style.display = 'none'; }, 2000);
  }
}

function addLogSet(exName) {
  var container = document.getElementById('logsets-' + exName);
  if (!container) return;
  var idx = container.children.length + 1;
  var div = document.createElement('div');
  div.className = 'ex-log-set';
  div.innerHTML = '<label>#' + idx + '</label><input type="number" class="log-weight" placeholder="kg" step="0.5" min="0"><span class="unit">×</span><input type="number" class="log-reps" placeholder="次" min="0"><span class="unit">rep</span>';
  container.appendChild(div);
}

function renderExerciseWithLog(ex) {
  var modeClass = ex.mode === 'flex' ? 'tag-mode-flex' : (ex.mode === 'stab' ? 'tag-mode-stab' : 'tag-mode-perf');
  var modeText = ex.mode === 'flex' ? '灵活力量' : (ex.mode === 'stab' ? '稳定力量' : '运动表现');

  h += '<div class="ex-header"><span class="ex-name">' + ex.name + '</span><span class="ex-sets">' + ex.sets + '</span></div>';
  h += '<div class="ex-meta">';
  h += '<span class="ex-tag ' + modeClass + '">' + modeText + '</span>';
  if (ex.rest && ex.rest !== '—') h += '<span class="ex-tag tag-rest">休息 ' + ex.rest + '</span>';
  if (ex.type) h += '<span class="ex-tag tag-rest">' + ex.type + '</span>';
  h += '</div>';
  if (ex.note) h += '<p class="ex-note">' + ex.note + '</p>';

  return h;

// ===== RENDER: NUTRITION =====
function renderNutrition() {
  var p = state.profile;
  var html = '';

  if (!p || !p.weight || !p.height || !p.age) {
    html = '<div class="empty"><h3>请先完成问卷</h3><p>营养方案需要根据您的身体数据计算</p></div>';
    document.getElementById('panel-nutrition').innerHTML = html;
    return;
  }

  var reportToday = getReportData() || {};
  var weightKg = reportToday.weight ? parseFloat(reportToday.weight) : parseFloat(p.weight);
  var heightCm = parseFloat(p.height);
  var age = parseInt(p.age);
  var weightLbs = weightKg * 2.205;

  // BMR Mifflin-St Jeor Female
  var bmr = 10 * weightKg + 6.25 * heightCm - 5 * age - 161;

  // Activity factor
  var freq = parseInt(p.trainingFreq) || 3;
  var af = 1.2;
  if (freq === 0) af = 1.2;
  else if (freq <= 2) af = 1.375;
  else if (freq <= 4) af = 1.55;
  else af = 1.725;

  var tdee = Math.round(bmr * af);
  bmr = Math.round(bmr);

  // Phase adjustment
  var w = state.currentWeek;
  var multiplier = 1;
  var strategy = '';
  if (w <= 2) { multiplier = 1; strategy = '维持热量'; }
  else if (w <= 5) { multiplier = 0.9; strategy = '轻度减脂'; }
  else { multiplier = 1.1; strategy = '微盈余增肌'; }

  var targetCal = Math.round(tdee * multiplier);

  // Macros
  var proteinG = Math.round(weightLbs * 1.1); // midpoint 1.0-1.2
  var carbG = Math.round((targetCal * 0.4) / 4);
  var fatG = Math.round((targetCal * 0.25) / 9);

  html += '<div class="phase-badge ' + getPhase(w).cls + '">' + getPhase(w).name + ' · ' + strategy + '</div>';

  var weightSource = reportToday.weight ? '今日晨重 ' + weightKg + 'kg' : '问卷体重 ' + weightKg + 'kg（填写晨间打卡后自动更新）';
  html += '<div style="font-size:11px;color:var(--text3);margin-bottom:12px">计算体重：' + weightSource + '</div>';

  html += '<div class="card"><div class="card-title">基础代谢</div>';
  html += '<div class="macro-grid">';
  html += '<div class="macro-item"><div class="macro-val">' + bmr + '</div><div class="macro-label">BMR kcal</div></div>';
  html += '<div class="macro-item"><div class="macro-val">' + tdee + '</div><div class="macro-label">TDEE kcal</div></div>';
  html += '</div></div>';

  html += '<div class="card"><div class="card-title">每日目标</div>';
  html += '<div class="macro-grid">';
  html += '<div class="macro-item"><div class="macro-val">' + targetCal + '</div><div class="macro-label">目标热量 kcal</div></div>';
  html += '<div class="macro-item"><div class="macro-val">' + proteinG + 'g</div><div class="macro-label">蛋白质</div></div>';
  html += '<div class="macro-item"><div class="macro-val">' + carbG + 'g</div><div class="macro-label">碳水化合物</div></div>';
  html += '<div class="macro-item"><div class="macro-val">' + fatG + 'g</div><div class="macro-label">脂肪</div></div>';
  html += '</div>';
  html += '<p style="font-size:12px;color:var(--text3);margin-top:8px">蛋白质 ' + proteinG + 'g × 4 = ' + (proteinG*4) + ' kcal | 碳水 ' + carbG + 'g × 4 = ' + (carbG*4) + ' kcal | 脂肪 ' + fatG + 'g × 9 = ' + (fatG*9) + ' kcal</p>';
  html += '</div>';

  // Meal template
  var proteinPerMeal = Math.round(proteinG / 4);
  var carbPerMeal = Math.round(carbG / 4);

  html += '<div class="card"><div class="card-title">4餐模板</div>';
  html += '<div class="meal-plan">';
  html += mealRow('早餐 7-8am', '鸡蛋2个 + 燕麦50g + 莓果 + ' + proteinPerMeal + 'g 蛋白');
  html += mealRow('午餐 12pm', '鸡胸/鱼150g + 糙米/红薯 + 蔬菜');
  html += mealRow('训练前 4pm', '香蕉 + 全麦面包 + 蛋白粉（可选）');
  html += mealRow('晚餐 7pm', '瘦牛肉/三文鱼150g + 蔬菜 + 适量主食');
  html += '</div>';
  html += '<p style="font-size:12px;color:var(--text3);margin-top:12px">每餐约 ' + proteinPerMeal + 'g 蛋白质 · ' + carbPerMeal + 'g 碳水</p>';
  html += '</div>';

  html += '<div class="principle"><h4>💡 营养原则</h4>';
  html += '<p>骨骼重建需要充足的蛋白质作为胶原基质，同时需要钙、维生素D、维生素K2协同作用。训练日营养围绕训练窗口分配，非训练日均匀分配即可。</p></div>';

  document.getElementById('panel-nutrition').innerHTML = html;
}

function mealRow(name, detail) {
  return '<div class="meal-row"><span class="meal-name">' + name + '</span><span class="meal-detail">' + detail + '</span></div>';
}

// ===== RENDER: SUPPLEMENTS =====
function renderSupplements() {
  var p = state.profile;
  var symptoms = [];
  if (p && p.symptoms) {
    if (Array.isArray(p.symptoms)) symptoms = p.symptoms;
    else if (typeof p.symptoms === 'string') {
      try { symptoms = JSON.parse(p.symptoms); } catch(e) { symptoms = [p.symptoms]; }
    }
  }
  var sympStr = symptoms.join(',').toLowerCase();

  var html = '<div class="card-title" style="margin-bottom:12px">补剂方案</div>';
  html += '<p style="font-size:13px;color:var(--text3);margin-bottom:16px">基于您的症状评估结果个性化推荐</p>';

  // Always: Creatine
  html += suppCard('肌酸 Creatine Monohydrate', '3-5g / 天', '每日任意时间，训练后更佳',
    '提升磷酸肌酸储备，增强高强度运动表现；对骨密度有间接正面影响', 'A',
    '一水肌酸，无需特殊剂型');

  // Always: Protein powder if needed
  var proteinNote = '';
  if (p && p.weight) {
    var proteinTarget = Math.round(parseFloat(p.weight) * 2.205 * 1.1);
    proteinNote = '每日蛋白质目标 ' + proteinTarget + 'g，若食物摄入不足则补充';
  } else {
    proteinNote = '用于补充日常蛋白质摄入缺口';
  }
  html += suppCard('蛋白粉 Whey/Plant Protein', '按需补充', '训练后30min内或加餐',
    proteinNote, 'A',
    '乳清蛋白或植物蛋白均可，选择口味可接受的');

  // Conditionals
  var needBoneJoint = /骨密度|骨质疏松|关节|膝盖|疼痛|arthr|bone|joint/i.test(sympStr);
  var needSleep = /睡眠|失眠|sleep|insomnia/i.test(sympStr);
  var needIron = /疲劳|能量|fatigue|energy|贫血|铁/i.test(sympStr);

  if (needBoneJoint) {
    html += suppCard('维生素D3 Vitamin D3', '2000-4000 IU / 天', '随餐服用（脂溶性）',
      '促进钙吸收，调节骨代谢；多数女性存在VD不足', 'A',
      '建议先检测血清25(OH)D水平');
    html += suppCard('钙 Calcium', '500-1000mg / 天', '分2次随餐服用',
      '骨骼矿化核心原料；配合VD+K2协同', 'A',
      '柠檬酸钙吸收率优于碳酸钙；单次不超过500mg');
    html += suppCard('维生素K2 Vitamin K2 (MK-7)', '100-200μg / 天', '随含脂肪餐服用',
      '引导钙沉积至骨骼而非血管，激活骨钙素(osteocalcin)', 'B',
      '服用抗凝血药物者需咨询医生');
  } else {
    html += suppCard('维生素D3 Vitamin D3', '1000-2000 IU / 天', '随餐服用',
      '维持基础VD水平，支持骨骼和免疫健康', 'B',
      '日照不足地区建议常规补充');
  }

  if (needSleep) {
    html += suppCard('镁 Magnesium (Glycinate)', '300-400mg / 天', '睡前30-60min',
      '促进肌肉放松和睡眠质量；甘氨酸镁吸收率高、不引起腹泻', 'B',
      '避免氧化镁（吸收差、易腹泻）');
  }

  if (needIron) {
    html += suppCard('铁蛋白检测提醒', '—', '—',
      '疲劳和能量下降可能与铁缺乏相关，建议进行血清铁蛋白(ferritin)检测。女性运动员铁缺乏率高。', 'C',
      '切勿盲目补铁，需先检测确认');
  }

  // General
  html += suppCard('Omega-3 鱼油', '1-2g EPA+DHA / 天', '随餐服用',
    '抗炎、支持关节健康和心血管功能', 'B',
    '选择IFOS认证产品');

  html += '<div class="principle" style="margin-top:20px"><h4>⚠️ 重要提示</h4>';
  html += '<p>补剂是"补充"而非"替代"。优先通过均衡饮食获取营养。所有补剂建议在使用前咨询医疗专业人员，特别是存在基础疾病或服用药物的情况。</p></div>';

  document.getElementById('panel-supplements').innerHTML = html;
}

function suppCard(name, dose, timing, effect, evidence, note) {
  var evClass = evidence === 'A' ? 'evidence-a' : (evidence === 'B' ? 'evidence-b' : 'evidence-c');
  var h = '<div class="supp-item">';
  h += '<div class="supp-header"><span class="supp-name">' + name + '</span><span class="supp-evidence ' + evClass + '">证据等级 ' + evidence + '</span></div>';
  h += '<dl class="supp-detail">';
  h += '<dt>剂量</dt><dd>' + dose + '</dd>';
  h += '<dt>时间</dt><dd>' + timing + '</dd>';
  h += '<dt>作用</dt><dd>' + effect + '</dd>';
  h += '</dl>';
  if (note) h += '<p class="supp-note">' + note + '</p>';
  h += '</div>';
  return h;
}

// ===== RENDER: PROGRESS =====
function renderProgress() {
  var html = '';
  var today = new Date();

  // Collect last 7 days of data (report first, fallback to morning)
  var morningDays = [];
  for (var di = 6; di >= 0; di--) {
    var d = new Date(today);
    d.setDate(d.getDate() - di);
    var ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    var label = String(d.getMonth()+1) + '/' + String(d.getDate());
    var mData = null;
    try {
      mData = JSON.parse(localStorage.getItem('wt_report_' + ds));
      if (mData) {
        mData.weight = mData.weight || null;
        mData.hrv = mData.hrv || null;
      }
    } catch(e) { mData = null; }
    if (!mData) {
      try {
        var oldData = JSON.parse(localStorage.getItem('wt_morning_' + ds));
        if (oldData) {
          mData = { weight: oldData.weight || null, hrv: oldData.hrv || null, sleepQuality: oldData.sleep || null };
        }
      } catch(e) {}
    }
    morningDays.push({ date: ds, label: label, data: mData });
  }

  // Stats: checkin count this week, avg RPE
  var w = state.currentWeek;
  var checkinCount = 0;
  for (var dow = 0; dow <= 6; dow++) {
    if (isCheckinDone(w, dow)) checkinCount++;
  }

  // Collect RPE from all logs for current week
  var dayKeys = ['Lower A','Upper A','Cardio','Lower B','Upper B','Saturday'];
  var rpeSum = 0, rpeCount = 0;
  var totalVolume = 0;
  dayKeys.forEach(function(dk) {
    try {
      var logData = JSON.parse(localStorage.getItem('wt_log_W' + w + '_' + dk));
      if (logData && logData.exercises) {
        Object.keys(logData.exercises).forEach(function(exName) {
          var ex = logData.exercises[exName];
          if (ex.rpe) { rpeSum += ex.rpe; rpeCount++; }
          if (ex.sets) {
            ex.sets.forEach(function(s) {
              totalVolume += (s.weight || 0) * (s.reps || 0);
            });
          }
        });
      }
    } catch(e) {}
  });
  var avgRpe = rpeCount > 0 ? (rpeSum / rpeCount).toFixed(1) : '—';

  // Stats cards
  html += '<div class="card-title" style="margin-bottom:12px">数据趋势</div>';
  html += '<div class="progress-stat-row">';
  html += '<div class="progress-stat"><div class="ps-val">' + checkinCount + '</div><div class="ps-label">本周打卡天数</div></div>';
  html += '<div class="progress-stat"><div class="ps-val">' + avgRpe + '</div><div class="ps-label">平均 RPE</div></div>';
  html += '</div>';
  html += '<div class="progress-stat-row">';
  html += '<div class="progress-stat"><div class="ps-val">' + totalVolume + '</div><div class="ps-label">训练量 (kg×rep)</div></div>';
  html += '<div class="progress-stat"><div class="ps-val">' + rpeCount + '</div><div class="ps-label">已记录动作</div></div>';
  html += '</div>';

  // Weight chart (last 7 days)
  var weightVals = morningDays.filter(function(d){ return d.data && d.data.weight; });
  html += '<div class="progress-card"><div class="card-title">体重趋势 (近7天)</div>';
  if (weightVals.length >= 2) {
    html += buildLineChart(morningDays, function(d){ return d.data ? d.data.weight : null; }, 'kg');
  } else {
    html += '<div class="progress-empty">至少需要2天晨间打卡数据才能显示趋势</div>';
  }
  html += '</div>';

  // HRV chart
  var hrvVals = morningDays.filter(function(d){ return d.data && d.data.hrv; });
  html += '<div class="progress-card"><div class="card-title">HRV 趋势 (近7天)</div>';
  if (hrvVals.length >= 2) {
    html += buildLineChart(morningDays, function(d){ return d.data ? d.data.hrv : null; }, 'ms');
  } else {
    html += '<div class="progress-empty">至少需要2天晨间打卡数据才能显示趋势</div>';
  }
  html += '</div>';

  // Training volume from logs across recent days
  html += '<div class="progress-card"><div class="card-title">本周训练记录</div>';
  var hasAnyLog = false;
  dayKeys.forEach(function(dk) {
    try {
      var logData = JSON.parse(localStorage.getItem('wt_log_W' + w + '_' + dk));
      if (logData && logData.exercises && Object.keys(logData.exercises).length > 0) {
        hasAnyLog = true;
        var dayVol = 0;
        var dayRpeSum = 0, dayRpeN = 0;
        Object.keys(logData.exercises).forEach(function(exName) {
          var ex = logData.exercises[exName];
          if (ex.rpe) { dayRpeSum += ex.rpe; dayRpeN++; }
          if (ex.sets) ex.sets.forEach(function(s) { dayVol += (s.weight||0) * (s.reps||0); });
        });
        html += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">';
        html += '<span style="font-weight:700">' + dk + '</span>';
        html += '<span style="color:var(--text3)">' + Object.keys(logData.exercises).length + ' 动作 · ' + dayVol + ' kg · RPE ' + (dayRpeN > 0 ? (dayRpeSum/dayRpeN).toFixed(1) : '—') + '</span>';
        html += '</div>';
      }
    } catch(e) {}
  });
  if (!hasAnyLog) {
    html += '<div class="progress-empty">暂无训练记录数据，在 Today 页面完成训练后可记录每个动作的实际数据</div>';
  }
  html += '</div>';

  document.getElementById('panel-progress').innerHTML = html;
}

// SVG line chart builder
function buildLineChart(days, valueFn, unit) {
  var W = 300, H = 120, padL = 36, padR = 10, padT = 10, padB = 24;
  var chartW = W - padL - padR;
  var chartH = H - padT - padB;

  // Extract values and filter nulls
  var points = [];
  var vals = [];
  days.forEach(function(d, i) {
    var v = valueFn(d);
    if (v !== null && v !== undefined) {
      points.push({ idx: i, val: v, label: d.label });
      vals.push(v);
    }
  });

  if (vals.length < 2) return '<div class="progress-empty">数据不足</div>';

  var minV = Math.min.apply(null, vals);
  var maxV = Math.max.apply(null, vals);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  var rangeV = maxV - minV;
  // Add 10% padding
  minV -= rangeV * 0.1;
  maxV += rangeV * 0.1;
  rangeV = maxV - minV;

  var xStep = points.length > 1 ? chartW / (days.length - 1) : 0;

  var svg = '<div class="chart-container"><svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

  // Grid lines
  for (var gi = 0; gi <= 3; gi++) {
    var gy = padT + (chartH / 3) * gi;
    svg += '<line class="chart-grid" x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '"/>';
    var gv = (maxV - (rangeV / 3) * gi).toFixed(1);
    svg += '<text class="chart-label" x="' + (padL - 4) + '" y="' + (gy + 3) + '" text-anchor="end">' + gv + '</text>';
  }

  // Build path
  var pathPoints = [];
  points.forEach(function(p) {
    var x = padL + p.idx * xStep;
    var y = padT + chartH - ((p.val - minV) / rangeV) * chartH;
    pathPoints.push({ x: x, y: y, val: p.val, label: p.label });
  });

  // Area fill
  if (pathPoints.length > 1) {
    var areaPath = 'M' + pathPoints[0].x + ',' + (padT + chartH);
    pathPoints.forEach(function(p) { areaPath += ' L' + p.x + ',' + p.y; });
    areaPath += ' L' + pathPoints[pathPoints.length-1].x + ',' + (padT + chartH) + ' Z';
    svg += '<path class="chart-area" d="' + areaPath + '"/>';
  }

  // Line
  var linePath = 'M' + pathPoints[0].x + ',' + pathPoints[0].y;
  for (var li = 1; li < pathPoints.length; li++) {
    linePath += ' L' + pathPoints[li].x + ',' + pathPoints[li].y;
  }
  svg += '<path class="chart-line" d="' + linePath + '"/>';

  // Dots and labels
  pathPoints.forEach(function(p) {
    svg += '<circle class="chart-dot" cx="' + p.x + '" cy="' + p.y + '" r="3"/>';
    svg += '<text class="chart-label" x="' + p.x + '" y="' + (p.y - 8) + '" text-anchor="middle" style="font-size:9px;fill:var(--gold)">' + p.val + '</text>';
  });

  // X-axis date labels
  days.forEach(function(d, i) {
    var x = padL + i * xStep;
    svg += '<text class="chart-date" x="' + x + '" y="' + (H - 4) + '" text-anchor="middle">' + d.label + '</text>';
  });

  svg += '</svg></div>';
  return svg;
}
