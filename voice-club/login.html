<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARISE CLUB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC",sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow:hidden;
}

/* ── Main headline ── */
.headline{
  text-align:center;
  margin-bottom:48px;
  max-width:600px;
}
.headline .line{
  font-size:clamp(36px,8vw,72px);
  font-weight:900;
  line-height:1.05;
  letter-spacing:-0.02em;
  color:#fff;
  text-transform:uppercase;
}
.headline .line.green{
  color:#39FF14;
  text-decoration:underline;
  text-underline-offset:6px;
  text-decoration-thickness:3px;
}

/* ── Login card ── */
.login-box{
  width:100%;
  max-width:340px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:28px 24px 24px;
}
.login-box .field{margin-bottom:14px}
.login-box label{
  display:block;
  font-size:11px;
  font-weight:600;
  letter-spacing:2px;
  text-transform:uppercase;
  color:rgba(255,255,255,.35);
  margin-bottom:6px;
}
.login-box input{
  width:100%;
  height:42px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  padding:0 14px;
  font-size:15px;
  color:#fff;
  outline:none;
  transition:border-color .2s;
}
.login-box input:focus{border-color:#39FF14}
.login-box input::placeholder{color:rgba(255,255,255,.2)}
.login-box .btn{
  width:100%;
  height:44px;
  background:#39FF14;
  color:#000;
  font-size:14px;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:6px;
  transition:opacity .2s;
}
.login-box .btn:hover{opacity:.85}
.login-box .btn:active{opacity:.7}
.login-box .error{
  color:#ff4444;
  font-size:12px;
  text-align:center;
  margin-top:12px;
  min-height:18px;
}

/* ─ Brand footer ── */
.brand-foot{
  margin-top:36px;
  text-align:center;
}
.brand-foot .logo-line{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:4px;
}
.brand-foot .cn{
  font-size:13px;
  letter-spacing:4px;
  color:rgba(255,255,255,.4);
}
.brand-foot .en{
  font-size:20px;
  font-weight:800;
  letter-spacing:4px;
  color:#fff;
}
.brand-foot .tag{
  font-size:10px;
  letter-spacing:3px;
  color:rgba(255,255,255,.25);
  text-transform:uppercase;
}

/* ── Responsive ── */
@media(max-width:380px){
  .headline .line{font-size:32px}
  .login-box{padding:22px 18px 20px}
}
</style>
</head>
<body>

<div class="headline">
  <div class="line">YOUR VOICE</div>
  <div class="line">IS YOUR</div>
  <div class="line green">SUPERPOWER.</div>
</div>

<div class="login-box">
  <div class="field">
    <label for="nameInput">Name</label>
    <input type="text" id="nameInput" placeholder="请输入你的姓名" autocomplete="name">
  </div>
  <div class="field">
    <label for="codeInput">Invite Code</label>
    <input type="text" id="codeInput" placeholder="请输入邀请码" autocomplete="off" style="text-transform:uppercase">
  </div>
  <button class="btn" onclick="doLogin()">Enter</button>
  <div class="error" id="errorBox"></div>
</div>

<div class="brand-foot">
  <div class="logo-line">
    <span class="cn">发生俱乐部</span>
    <span class="en">ARISE</span>
  </div>
  <div class="tag">Where Strength Meets Science</div>
</div>

<script>
var CODES={'VC2026A':{id:'vc001'},'VC2026B':{id:'vc002'},'VC2026C':{id:'vc003'},'COACH':{id:'coach',isCoach:true}};
(function(){if(localStorage.getItem('vc_role'))window.location.href='app.html'})();
function doLogin(){
  var n=document.getElementById('nameInput').value.trim();
  var c=document.getElementById('codeInput').value.trim().toUpperCase();
  var e=document.getElementById('errorBox');
  e.textContent='';
  if(!n){e.textContent='请输入姓名';return}
  if(!c){e.textContent='请输入邀请码';return}
  var u=CODES[c];
  if(!u){e.textContent='邀请码无效，请检查后重试';return}
  localStorage.setItem('vc_name',n);
  localStorage.setItem('vc_user_id',u.id);
  localStorage.setItem('vc_role',u.isCoach?'coach':'student');
  localStorage.setItem('vc_invite_code',c);
  window.location.href='app.html';
}
document.addEventListener('keydown',function(ev){if(ev.key==='Enter')doLogin()});
</script>
</body>
</html>
