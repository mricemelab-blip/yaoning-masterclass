<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arise 发声俱乐部</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;--gold:#C5A55A;--gold-dim:#9a8347;--text:#e8e8e8;--text2:#999999;--text3:#666666;--border:#2a2a2a;--radius:8px}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== NAV ===== */
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{font-size:1.125rem;font-weight:700;color:var(--gold);letter-spacing:.04em}
.nav-right{display:flex;align-items:center;gap:.75rem}
.nav-user{font-size:.875rem;color:var(--text2)}
.nav-logout{background:none;border:1px solid var(--border);color:var(--text2);padding:.25rem .625rem;border-radius:var(--radius);font-size:.75rem;cursor:pointer;transition:border-color .2s,color .2s}
.nav-logout:hover{border-color:var(--gold);color:var(--gold)}

/* ===== TABS ===== */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:56px;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;padding:.875rem 1.25rem;font-size:.875rem;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .2s,border-color .2s;white-space:nowrap}
.tab-btn:hover{color:var(--text2)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

/* ===== MAIN ===== */
.main{flex:1;padding:1.5rem;max-width:960px;width:100%;margin:0 auto}
@media(max-width:480px){.main{padding:1rem .75rem}}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ===== CARDS (Literature) ===== */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1rem;transition:border-color .2s}
.card:hover{border-color:var(--gold-dim)}
.card-title{font-size:1rem;font-weight:600;color:var(--text);margin-bottom:.375rem;line-height:1.4}
.card-meta{font-size:.75rem;color:var(--text3);margin-bottom:.625rem}
.card-summary{font-size:.875rem;color:var(--text2);line-height:1.65;margin-bottom:.75rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-full{display:none;font-size:.875rem;color:var(--text2);line-height:1.75;margin-bottom:.75rem}
.card-full.expanded{display:block}
.card-summary.hidden{display:none}
.card-btn{background:none;border:1px solid var(--gold-dim);color:var(--gold);padding:.375rem .875rem;border-radius:var(--radius);font-size:.8125rem;cursor:pointer;transition:background .2s,color .2s}
.card-btn:hover{background:var(--gold);color:var(--bg)}

/* ===== COURSES ===== */
.course-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1rem}
.course-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem}
.course-name{font-size:1rem;font-weight:600;color:var(--text)}
.course-hours{font-size:.75rem;color:var(--text3)}
.progress-wrap{background:var(--bg4);border-radius:4px;height:6px;margin:.625rem 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:4px;transition:width .4s ease}
.course-footer{display:flex;justify-content:space-between;align-items:center}
.course-pct{font-size:.75rem;color:var(--text3)}
.course-btn{background:none;border:1px solid var(--gold-dim);color:var(--gold);padding:.375rem .875rem;border-radius:var(--radius);font-size:.8125rem;cursor:pointer;transition:background .2s,color .2s}
.course-btn:hover{background:var(--gold);color:var(--bg)}
.course-btn.completed{border-color:var(--text3);color:var(--text3);cursor:default}
.course-btn.completed:hover{background:none;color:var(--text3)}

/* ===== REPLAYS ===== */
.replay-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.replay-info{flex:1;min-width:0}
.replay-title{font-size:1rem;font-weight:600;color:var(--text);margin-bottom:.25rem}
.replay-meta{font-size:.75rem;color:var(--text3)}
.replay-btn{flex:0 0 auto;background:none;border:1px solid var(--gold-dim);color:var(--gold);padding:.375rem .875rem;border-radius:var(--radius);font-size:.8125rem;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.replay-btn:hover{background:var(--gold);color:var(--bg)}

/* ===== PLACEHOLDER ===== */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem;text-align:center}
.placeholder-icon{font-size:3rem;margin-bottom:1.25rem;opacity:.35}
.placeholder-text{font-size:1rem;color:var(--text3);line-height:1.7}

/* ===== FOOTER ===== */
.footer{border-top:1px solid var(--border);padding:1.25rem;text-align:center;font-size:.75rem;color:var(--text3)}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){
  .nav{padding:0 1rem}
  .nav-logo{font-size:1rem}
  .replay-card{flex-direction:column;align-items:flex-start;gap:.75rem}
  .replay-btn{width:100%}
  .course-footer{flex-direction:column;align-items:flex-start;gap:.5rem}
  .course-btn{width:100%;text-align:center}
}

/* ===== LITERATURE TOOLBAR ===== */
.lit-toolbar{margin-bottom:1.25rem}
.lit-search{width:100%;height:40px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;font-size:.875rem;color:var(--text);outline:none;margin-bottom:.75rem;transition:border-color .2s}
.lit-search:focus{border-color:var(--gold)}
.lit-search::placeholder{color:var(--text3)}
.lit-filters{display:flex;gap:.375rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.25rem}
.lit-filters::-webkit-scrollbar{display:none}
.lit-filter{flex:0 0 auto;background:var(--bg3);border:1px solid var(--border);color:var(--text3);padding:.25rem .625rem;border-radius:20px;font-size:.75rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.lit-filter:hover{border-color:var(--gold-dim);color:var(--text2)}
.lit-filter.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.lit-filter span{font-size:.6875rem;opacity:.7;margin-left:2px}

/* ===== LIT CARD ===== */
.lit-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:.75rem;transition:border-color .2s}
.lit-card:hover{border-color:var(--gold-dim)}
.lit-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;margin-bottom:.375rem}
.lit-card-title{font-size:.9375rem;font-weight:600;color:var(--text);line-height:1.45;flex:1}
.lit-card-type{flex:0 0 auto;font-size:.625rem;padding:.125rem .5rem;border-radius:10px;letter-spacing:.5px;white-space:nowrap;margin-top:2px}
.type-srma{background:rgba(200,164,94,.12);color:#C8A45E;border:1px solid rgba(200,164,94,.2)}
.type-nma{background:rgba(76,175,80,.1);color:#66BB6A;border:1px solid rgba(76,175,80,.2)}
.type-umb{background:rgba(100,181,246,.1);color:#64B5F6;border:1px solid rgba(100,181,246,.2)}
.type-rct{background:rgba(255,152,0,.1);color:#FFA726;border:1px solid rgba(255,152,0,.2)}
.type-pos{background:rgba(171,71,188,.1);color:#CE93D8;border:1px solid rgba(171,71,188,.2)}
.type-other{background:rgba(255,255,255,.05);color:var(--text3);border:1px solid var(--border)}
.lit-card-meta{font-size:.75rem;color:var(--text3);margin-bottom:.5rem}
.lit-card-meta span{margin-right:.75rem}
.lit-card-summary{font-size:.8125rem;color:var(--text2);line-height:1.65}
.lit-card-journal{font-size:.6875rem;color:var(--text3);margin-top:.5rem;font-style:italic}
.lit-card-journal a{color:var(--gold-dim);text-decoration:none}
.lit-card-journal a:hover{color:var(--gold);text-decoration:underline}
.lit-empty{text-align:center;padding:3rem 1rem}

@media(max-width:480px){
  .lit-card{padding:.875rem 1rem}
  .lit-card-title{font-size:.875rem}
}
</style>

<script>
(function(){
  /* Auth check */
  var role = localStorage.getItem('vc_role');
  if(!role){
    window.location.href = 'login.html';
    return;
  }
  var name = localStorage.getItem('vc_name') || '用户';
  document.getElementById('navUser').textContent = name;
})();

function handleLogout(){
  localStorage.removeItem('vc_name');
  localStorage.removeItem('vc_user_id');
  localStorage.removeItem('vc_role');
  localStorage.removeItem('vc_invite_code');
  window.location.href = 'login.html';
}

/* Tab switching */
(function(){
  var btns = document.querySelectorAll('.tab-btn');
  var panels = document.querySelectorAll('.tab-panel');
  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      btns.forEach(function(b){b.classList.remove('active')});
      panels.forEach(function(p){p.classList.remove('active')});
      btn.classList.add('active');
      var target = document.getElementById('panel-' + btn.getAttribute('data-tab'));
      if(target) target.classList.add('active');
    });
  });
})();

/* Literature expand/collapse */
function toggleRead(btn){
  var card = btn.parentElement;
  var summary = card.querySelector('.card-summary');
  var full = card.querySelector('.card-full');
  var expanded = full.classList.contains('expanded');
  if(expanded){
    full.classList.remove('expanded');
    summary.classList.remove('hidden');
    btn.textContent = '阅读更多';
  } else {
    full.classList.add('expanded');
    summary.classList.add('hidden');
    btn.textContent = '收起';
  }
}

/* Course progress */
(function(){
  var defaults = {'1':30,'2':0,'3':60,'4':100};
  for(var i=1;i<=4;i++){
    var key = 'vc_progress_' + i;
    var stored = localStorage.getItem(key);
    var pct = stored !== null ? parseInt(stored,10) : defaults[i];
    var bar = document.getElementById('progress-'+i);
    var pctEl = document.getElementById('pct-'+i);
    var btn = document.querySelector('[data-course="'+i+'"]');
    if(bar) bar.style.width = pct + '%';
    if(pctEl) pctEl.textContent = pct + '%';
    if(btn && pct >= 100){
      btn.textContent = '已完成';
      btn.classList.add('completed');
    }
  }
})();

function handleCourseClick(btn){
  var courseId = btn.getAttribute('data-course');
  var key = 'vc_progress_' + courseId;
  var current = parseInt(localStorage.getItem(key) || '0', 10);
  if(current >= 100) return;
  var next = Math.min(current + 10, 100);
  localStorage.setItem(key, next);
  var bar = document.getElementById('progress-'+courseId);
  var pctEl = document.getElementById('pct-'+courseId);
  if(bar) bar.style.width = next + '%';
  if(pctEl) pctEl.textContent = next + '%';
  if(next >= 100){
    btn.textContent = '已完成';
    btn.classList.add('completed');
  }
}

var litCurrentFilter = 'all';
var litSearchTerm = '';

function getTypeClass(type){
  var map = {'SR/MA':'type-srma','NMA':'type-nma','伞评':'type-umb','RCT':'type-rct','立场声明':'type-pos'};
  return map[type] || 'type-other';
}

function renderLitCounts(){
  var counts = {'all':LIT_DATA.length,'SR/MA':0,'NMA':0,'伞评':0,'RCT':0,'文献解读':0};
  for(var i=0;i<LIT_DATA.length;i++){
    var t = LIT_DATA[i].type;
    if(counts[t] !== undefined) counts[t]++;
  }
  counts['文献解读'] = LIT_DATA.length - counts['SR/MA'] - counts['NMA'] - counts['伞评'] - counts['RCT'] - 1;
  document.getElementById('count-all').textContent = counts['all'];
  document.getElementById('count-srma').textContent = counts['SR/MA'];
  document.getElementById('count-nma').textContent = counts['NMA'];
  document.getElementById('count-umb').textContent = counts['伞评'];
  document.getElementById('count-rct').textContent = counts['RCT'];
  document.getElementById('count-other').textContent = counts['文献解读'];
}

function renderLitCards(){
  var container = document.getElementById('litContainer');
  var empty = document.getElementById('litEmpty');
  var term = litSearchTerm.toLowerCase();
  var filter = litCurrentFilter;
  var html = '';
  var count = 0;
  for(var i = LIT_DATA.length - 1; i >= 0; i--){
    var d = LIT_DATA[i];
    if(filter !== 'all' && d.type !== filter) continue;
    if(term){
      var searchStr = (d.title + ' ' + d.author + ' ' + d.year + ' ' + d.journal + ' ' + d.conclusion + ' ' + d.type).toLowerCase();
      if(searchStr.indexOf(term) === -1) continue;
    }
    count++;
    var typeClass = getTypeClass(d.type);
    html += '<div class="lit-card">';
    html += '<div class="lit-card-header">';
    html += '<div class="lit-card-title">' + escHtml(d.title) + '</div>';
    html += '<span class="lit-card-type ' + typeClass + '">' + escHtml(d.type) + '</span>';
    html += '</div>';
    html += '<div class="lit-card-meta"><span>' + d.author + ' ' + d.year + '</span><span>' + d.date + '</span></div>';
    if(d.conclusion) html += '<div class="lit-card-summary">' + escHtml(d.conclusion) + '</div>';
    if(d.journal) html += '<div class="lit-card-journal">' + escHtml(d.journal) + '</div>';
    html += '</div>';
  }
  container.innerHTML = html;
  empty.style.display = count === 0 ? 'block' : 'none';
}

function escHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setFilter(btn){
  document.querySelectorAll('.lit-filter').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  litCurrentFilter = btn.getAttribute('data-type');
  renderLitCards();
}

function filterLit(){
  litSearchTerm = document.getElementById('litSearch').value.trim();
  renderLitCards();
}

// Init literature
renderLitCounts();
renderLitCards();
</script>
