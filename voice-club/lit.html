者：需要在医生指导下进行药物治疗，钙和维生素D可能作为辅助治疗\n> 2. 严重维生素D缺乏者（血清25(OH)D < 10 ng/mL）：可能需要补充以纠正缺乏状态\n> 3. 长期护理机构中的老年人：证据有限，需个体化评估\n> 4. 特定疾病人群：如甲状旁腺疾病、慢性肾病、吸收不良综合征等\n> 5. 儿童青少年：骨骼生长发育期的营养需求不同，证据外推需谨慎\n>\n> 如有任何健康疑虑，请咨询专业医疗人员。", "full_text": "日期：2026-06-09  \n解读人：Arise  \n文献编号：文献库 / N-4 Massé 2026\n---\n## 一、文献基本信息\n| 字段 | 内容 |\n|------|------|\n| 标题 | Calcium, vitamin D, or combined supplementation to prevent fractures and falls: systematic review and meta-analysis（钙、维生素D或联合补充预防骨折与跌倒：系统综述与荟萃分析） |\n| 第一作者 | Olivier Massé, MD, MSc |\n| 通讯作者 | Olivier Massé, MD, MSc（加拿大 CIUSSS du Nord-de-l'Île-de-Montréal） |\n| 合作作者 | Claudia Mei Mercurio, BSc; Sébastien Dupuis, MSc; 等 |\n| 期刊 | *The BMJ*（英国医学杂志） |\n| 卷期 | 2026, 393: e088050 |\n| 发表日期 | 2026年5月20日（在线发表） |\n| DOI | 10.1136/bmj-2025-088050 |\n| PMID | 待更新（新发文献） |\n| 文献类型 | 系统综述与荟萃分析（Systematic Review and Meta-Analysis, SR/MA） |\n| 前瞻注册 | PROSPERO（注册号待核实） |\n| 报告规范 | PRISMA 2020声明 |\n| 纳入研究 | 69项随机对照试验（Randomized Controlled Trial, RCT） |\n| 总样本量 | 153,902名成人参与者 |\n| 检索数据库 | MEDLINE、Embase、Cochrane Central Register of Controlled Trials（CENTRAL）（截至2025年2月19日） |\n| 质量评估工具 | Cochrane RoB 2.0（偏倚风险评估工具第二版）、GRADE（证据分级评估系统） |\n---"}, {"id": 9, "date": "2026-06-10", "author": "", "year": "2026", "title": "每日文献解读 · 2026年6月10日", "type": "SR/MA", "journal": "*Diabetes, Obesity and Metabolism*（糖尿病、肥胖与代谢）", "doi": "[10.1111/dom.70873](https://doi.org/10.1111/dom.70873) |", "conclusion": "- 最佳训练模式仍存争议：虽然混合训练排名第一，但与力量训练的差异未达统计学显著性，不能定论混合训练显著优于单纯力量训练", "full_text": "---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Effects of Calorie Restriction With and Without Strength, Endurance or Mixed Training on Fat-Free and Skeletal Muscle Mass in Overweight or Obese Individuals—A Systematic Review With Pairwise Meta-Analysis and Network Meta-Analysis of Randomized Controlled Studies |\n| 中文标题 | 热量限制联合或不联合力量、耐力或混合训练对超重/肥胖个体瘦体重与骨骼肌质量的影响——随机对照研究的系统综述与配对荟萃分析及网络荟萃分析 |\n| 作者 | Magdalena Deller, Jan Weiershaus, Steffen Held, Christian Brinkmann |\n| 通讯作者 | Christian Brinkmann |\n| 期刊 | *Diabetes, Obesity and Metabolism*（糖尿病、肥胖与代谢） |\n| 发表日期 | 2026年5月17日 |\n| DOI | [10.1111/dom.70873](https://doi.org/10.1111/dom.70873) |\n| 文献类型 | 系统综述（Systematic Review, SR）+ 配对荟萃分析（Meta-Analysis, MA）+ 网络荟萃分析（Network Meta-Analysis, NMA） |\n| 注册编号 | 前瞻性系统综述注册库（International Prospective Register of Systematic Reviews, PROSPERO）CRD420251058428 |\n---"}, {"id": 10, "date": "2026-06-11", "author": "", "year": "2026", "title": "肌酸补充对力量、无氧表现与瘦体重的影响：训练背景的调节作用", "type": "SR/MA", "journal": "*Frontiers in Nutrition*（《营养学前沿》）", "doi": "10.3389/fnut.2026.1800546 |", "conclusion": "2. 中等确定性证据：瘦体重增益（抗阻训练背景下）\n- 效应量可观（+2.7-3.4 kg）\n- 但研究间存在中度异质性（训练方案、肌酸剂量、测量方法差异）\n- 部分研究偏倚风险存疑\n- 结论基本可靠：肌酸+抗阻训练能增加瘦体重，但具体增益幅度可能因个体和方案而异\n3. 低确定性证据：纵跳和腿举力量\n- 纵跳异质性极高（I²=89%），结果难以解释\n- 腿举研究数量少，结果不一致\n- 结论需谨慎：肌酸对跳跃表现的影响个体差异大，不能期望普遍改善", "full_text": "文献编号： N-2  \n解读日期： 2026-06-11  \n原文类型： 系统综述与荟萃分析（Systematic Review and Meta-Analysis, SR/MA）\n---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Creatine supplementation in young men under resistance versus non-resistance training: a systematic review and meta-analysis of strength, performance, and lean mass |\n| 作者 | Jinfa Gu, Yan Li, Jialing Xiao, Yu Zhang（通讯作者） |\n| 期刊 | *Frontiers in Nutrition*（《营养学前沿》） |\n| 发表日期 | 2026年4月8日 |\n| DOI | 10.3389/fnut.2026.1800546 |\n| 注册信息 | 前瞻性系统综述注册库（International Prospective Register of Systematic Reviews, PROSPERO） CRD420261283973 |\n| 纳入研究 | 37项随机对照试验（Randomized Controlled Trial, RCT），其中24项为抗阻训练背景，13项为非抗阻训练背景 |\n| 研究对象 | 18-30岁健康男性，训练水平从久坐到精英运动员不等 |\n| 干预方式 | 肌酸补充（多种剂量方案，含负荷期/维持期或固定日剂量）vs. 安慰剂/对照 |\n| 主要结局 | 无脂体重（Fat-Free Mass, FFM）、瘦体重（Lean Body Mass, LBM）、1次最大重量（1 Repetition Maximum, 1RM）深蹲/腿举、温盖特试验（Wingate Test）峰值/平均功率、纵跳（Countermovement Jump, CMJ）高度 |\n---"}, {"id": 11, "date": "2026-06-11", "author": "", "year": "2026", "title": "[Shi 2026] 不同运动方式对心力衰竭患者左心室射血分数改善的剂量反应与网络荟萃分析", "type": "SR/MA", "journal": "", "doi": "", "conclusion": "", "full_text": ""}, {"id": 12, "date": "2026-06-12", "author": "HongYu Yang（杨红宇）", "year": "2026", "title": "青少年足球运动员结构化损伤预防项目的有效性", "type": "SR/MA", "journal": "PeerJ", "doi": "10.7717/peerj.21319 |", "conclusion": "\"好，现在来说核心发现。\n第一，整体损伤风险降低了 38%。做预防训练的那一组，每小时的损伤概率是对照组的 0.62 倍。这个效应量在预防医学里算得上是中等偏强了。\n第二，各个部位都有改善。下肢损伤降低 32%，膝关节降低 33%，踝关节降低 28%，肌肉损伤降低 38%。几乎所有的损伤类型都出现了下降，说明预防训练是'全面防护'，不是只针对某一种损伤。\n第三，也是我觉得最有意思的一点：年龄越小，效果越好。13 岁以下的儿童组，损伤风险降低了 46%；而 13 到 18 岁的青少年组，降低了 32%。差了 14 个百分点。\n为什么会这样？研究人员的解释是，儿童期", "full_text": "日期：2026-06-12  \n解读人：Arise  \n文献编号：T-10 / Yang 2026\n---\n## 一、文献基本信息\n| 字段 | 内容 |\n|------|------|\n| 标题 | Effectiveness of sports injury prevention programs for adolescent and children football players: a meta-analysis and systematic review（青少年与儿童足球运动员运动损伤预防项目的有效性：系统综述与荟萃分析） |\n| 第一作者 | HongYu Yang（杨红宇） |\n| 通讯作者 | Xianming Ding（丁先明） |\n| 合作作者 | Yue Fan, Xiao Wang, Jia Hui Li |\n| 所属机构 | 成都体育学院足球学院、吉首大学体育学院 |\n| 期刊 | PeerJ |\n| 卷期 | 2026, 14:e21319 |\n| 发表日期 | 2026-06-01 |\n| 投稿日期 | 2025-08-05 |\n| 接收日期 | 2026-04-09 |\n| DOI | 10.7717/peerj.21319 |\n| 文献类型 | 系统综述与荟萃分析（Systematic Review and Meta-Analysis, SR/MA） |\n| 前瞻注册 | 前瞻性系统综述注册库（International Prospective Register of Systematic Reviews, PROSPERO）CRD420251030047（回顾性注册，2025-04-10） |\n| 报告规范 | 系统综述报告规范（PRISMA 2020） |\n| 纳入研究数 | 9 项随机对照试验（Randomized Controlled Trial, RCT） |\n| 总样本量 | 16,636 名参与者 |\n| 总暴露时长 | 1,248,381 小时 |\n| 检索数据库 | Cochrane Library、PubMed、EBSCO、Embase、Web of Science（检索至2026年3月） |\n| 质量评估工具 | Cochrane 偏倚风险评估工具（Risk of Bias, RoB） |\n| 统计软件 | Stata 17.0、RevMan 5.3 |\n| 数据与代码 | Zenodo: https://doi.org/10.5281/zenodo.19554138 |\n| 许可协议 | Creative Commons CC-BY 4.0（开放获取） |\n---"}, {"id": 13, "date": "2026-06-13", "author": "", "year": "2026", "title": "[McCarthy 2026] 饮食和膳食补充剂对运动女性铁状态的影响：干预试验的系统综述与荟萃分析", "type": "解读", "journal": "", "doi": "", "conclusion": "", "full_text": ""}, {"id": 14, "date": "2026-06-13", "author": "", "year": "2026", "title": "Naddafha 2026：肌酸对绝经后女性瘦体重、力量和骨密度的影响——系统综述与荟萃分析", "type": "SR/MA", "journal": "*Journal of the International Society of Sports Nutrition* (国际运动营养学会期刊)", "doi": "10.1080/15502783.2026.2668435 |", "conclusion": "- 肌酸 + 抗阻训练可有效增加绝经后女性的瘦体重\n   - 下肢力量提升显著（+7.5 kg），对预防跌倒、改善功能有直接意义\n   - 安全性良好，无严重不良反应\n2. 需谨慎的结论：\n   - 骨密度效应不明确——当前证据不支持肌酸单独作为骨质疏松预防手段\n   - 剂量效应：≥5g/天的效果优于低剂量，但最佳剂量仍需更多研究\n3. 局限性：\n   - 纳入研究的异质性：训练方案、肌酸剂量、测量工具不完全一致\n   - 随访时长偏短：多数研究 <24周，骨密度变化可能需要更长时间观察\n   - 部分研究的偏倚风险：allocat", "full_text": "## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Creatine monohydrate for lean mass, strength, and bone density in postmenopausal women: a systematic review and meta-analysis |\n| 作者 | Naddafha S, Antonio J, Kreider RB, Stout JR |\n| 期刊 | *Journal of the International Society of Sports Nutrition* (国际运动营养学会期刊) |\n| 发表日期 | 2026年12月31日 |\n| DOI | 10.1080/15502783.2026.2668435 |\n| 文献类型 | 系统综述与荟萃分析（Systematic Review and Meta-Analysis, SR/MA） |\n---"}, {"id": 15, "date": "2026-06-14", "author": "Kell Mazzini Ribeiro de Camargo", "year": "2026", "title": "肌酸补充对炎症生物标志物的影响：系统综述与荟萃分析解读", "type": "SR/MA", "journal": "*Frontiers in Immunology*（《免疫学前沿》）", "doi": "[10.3389/fimmu.2026.1743603](https://doi.org/10.3389/fimmu.2026.1743603) |", "conclusion": "|---------|--------------|-------------|------|-------------|------|\n| 急性效应 | +0.32 | [-0.29, +0.94] | 0.30 | 28% | 无显著差异 |\n| 慢性效应 | -0.11 | [-0.69, +0.48] | 0.73 | 0% | 无显著差异 |\n> 解读：无论是急性还是慢性补充，肌酸对 CRP 均无统计学显著影响。慢性效应的异质性为零（I²=0%），说明各研究结果高度一致。效应量极小（SMD=-0.11），远未达到临床意义阈值（通常 SMD≥0.2 才可能有微小临床意义）。", "full_text": "> 解读日期：2026-06-14\n> 文献编号：N-6\n> 领域：运动营养 · 补剂\n> 研究类型：系统综述与荟萃分析（SR/MA）\n> 受众：深度训练爱好者 / 学生\n---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Impact of creatine supplementation on inflammation: evidence from a systematic review and meta-analysis of randomized double-blind placebo trials |\n| 中文译名 | 肌酸补充对炎症的影响：随机双盲安慰剂试验的系统综述与荟萃分析证据 |\n| 第一作者 | Kell Mazzini Ribeiro de Camargo |\n| 通讯作者 | Vitor Engrácia Valenti |\n| 期刊 | *Frontiers in Immunology*（《免疫学前沿》） |\n| 发表年份 | 2026 |\n| DOI | [10.3389/fimmu.2026.1743603](https://doi.org/10.3389/fimmu.2026.1743603) |\n| 文献类型 | 系统综述与荟萃分析（Systematic Review and Meta-Analysis, SR/MA） |\n| PROSPERO注册号 | CRD420251027784 |\n| 纳入研究数 | 8 项随机双盲安慰剂对照试验（Randomized Controlled Trial, RCT） |\n---"}, {"id": 16, "date": "2026-06-15", "author": "Yuanbo Chang", "year": "2026", "title": "内脏脂肪怎么减最有效？不同运动方式与剂量的系统综述与网络荟萃分析", "type": "解读", "journal": "*Nutrition & Metabolism*（Nutr Metab Lond）", "doi": "[10.1186/s12986-026-01129-w](https://doi.org/10.1186/s12986-026-01129-w) |", "conclusion": "", "full_text": "> 解读日期：2026-06-15\n> 文献编号：T-11 / N-6\n> 领域：运动营养 · 身体成分 · 剂量反应\n---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Unveiling the perfect workout: exercise modalities and dosages to combat visceral adipose tissue in individuals with overweight and obesity - a systematic review with pairwise, network, and dose-response meta-analyses |\n| 中文标题 | 揭示最佳运动方案：超重/肥胖人群不同运动方式与剂量减少内脏脂肪的系统综述、成对及网络荟萃分析与剂量反应研究 |\n| 第一作者 | Yuanbo Chang |\n| 通讯作者 | Lu Wang（wanglu2022@cupes.edu.cn） |\n| 作者单位 | 首都体育学院（Capital University of Physical Education and Sports），北京 |\n| 期刊 | *Nutrition & Metabolism*（Nutr Metab Lond） |\n| 发表日期 | 2026年5月7日（Online ahead of print） |\n| DOI | [10.1186/s12986-026-01129-w](https://doi.org/10.1186/s12986-026-01129-w) |\n| PMID | 42098808 |\n| 文献类型 | 系统综述 + 网络荟萃分析 + 剂量反应荟萃分析（Systematic Review + Network Meta-Analysis + Dose-Response Meta-Analysis） |\n| PROSPERO注册号 | 未明确标注 |\n---"}, {"id": 17, "date": "2026-06-16", "author": "", "year": "2026", "title": "[Gawelczyk 2026] 低碳水化合物与生酮饮食对竞技运动员无氧表现的影响：系统综述与荟萃分析", "type": "解读", "journal": "", "doi": "", "conclusion": "", "full_text": ""}, {"id": 18, "date": "2026-06-16", "author": "", "year": "2026", "title": "每日高温环境下耐力运动的碳水化合物补充", "type": "SR/MA", "journal": "*Journal of the International Society of Sports Nutrition*（国际运动营养学会期刊, JISSN）", "doi": "[10.1080/15502783.2026.2669307](https://doi.org/10.1080/15502783.2026.2669307) |", "conclusion": "1. 研究设计局限：所有研究都有方法学缺陷（无预注册、样本量小），可能高估效应\n2. 结果不一致：阳性和阴性研究几乎各占一半，我们无法确定真实效应的方向和大小\n3. 间接性：全部是实验室功率车研究，不能直接推广到跑步、户外比赛等真实场景\n4. 不精确：单个研究样本量小，没有荟萃分析提供合并效应量，置信区间宽", "full_text": "> 解读日期：2026-06-16\n> 文献编号：N-1\n> 解读人：Arise\n---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Carbohydrate supplementation for endurance exercise in the heat: a systematic review with practical recommendations |\n| 中文标题 | 高温环境下耐力运动的碳水化合物补充：一项系统综述与实践建议 |\n| 作者 | Salame A, Brown D, Oueijan K, McCullough D |\n| 期刊 | *Journal of the International Society of Sports Nutrition*（国际运动营养学会期刊, JISSN） |\n| 发表日期 | 2026年5月9日 |\n| 卷期 | 23(1) |\n| DOI | [10.1080/15502783.2026.2669307](https://doi.org/10.1080/15502783.2026.2669307) |\n| 文献类型 | 系统综述（Systematic Review, SR）——叙述性综合，未进行荟萃分析 |\n| 纳入研究 | 9项随机对照试验（Randomized Controlled Trial, RCT），均为交叉设计 |\n| 总样本量 | 未明确汇总（单组样本量约8-15人） |\n---"}, {"id": 19, "date": "2026-06-16", "author": "", "year": "2026", "title": "[Zhao 2026] 舞蹈与其他运动方式对轻度认知障碍和痴呆的疗效比较：系统综述与贝叶斯网络荟萃分析", "type": "SR/MA", "journal": "", "doi": "", "conclusion": "", "full_text": ""}, {"id": 20, "date": "2026-06-17", "author": "", "year": "2026", "title": "每日青少年团队运动多成分神经肌肉训练的下肢损伤预防效果", "type": "伞评", "journal": "*Quality in Sport*（运动质量期刊）", "doi": "[10.12775/QS.2026.56.71637](https://doi.org/10.12775/QS.2026.56.71637) |", "conclusion": "", "full_text": "> 解读日期：2026-06-17\n> 文献编号：T-12\n> 解读人：Arise\n---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Effectiveness and Implementation of Multicomponent Neuromuscular Training Programs for Lower Extremity Injury Prevention in Adolescent Team Sport Athletes: A Systematic Review of Systematic Reviews and Meta‑analyses |\n| 中文标题 | 青少年团队运动运动员多成分神经肌肉训练预防下肢损伤的有效性与实施：系统综述之系统综述与荟萃分析 |\n| 作者 | Walczak P, Niewęgłowska M, Bender A, Widomska K, Bernad M, Krazińska O, Gałach M, Łukaszewicz J, Dąbrowski K, Szymulewicz B, Nejc W |\n| 期刊 | *Quality in Sport*（运动质量期刊） |\n| 发表日期 | 2026年5月23日 |\n| 卷期 | Vol. 56 |\n| DOI | [10.12775/QS.2026.56.71637](https://doi.org/10.12775/QS.2026.56.71637) |\n| 文献类型 | 伞评（Umbrella Review）——系统综述之系统综述与荟萃分析 |\n| 核心证据基础 | 16项随机对照试验（Randomized Controlled Trial, RCT）的青少年特异性荟萃分析，以及多篇针对足球、女子运动员的专项系统综述 |\n| 总样本量 | 单篇青少年荟萃分析纳入约 28,000+ 名运动员（跨研究汇总） |\n---"}, {"id": 21, "date": "2026-06-18", "author": "", "year": "2026", "title": "每日高强度间歇训练改善久坐成人心血管代谢健康——Cochrane系统综述", "type": "SR/MA", "journal": "*Cochrane Database of Systematic Reviews*（考克兰系统综述数据库）", "doi": "[10.1002/14651858.CD013617.pub2](https://doi.org/10.1002/14651858.CD013617.pub2) |", "conclusion": "", "full_text": "> 解读日期：2026-06-18\n> 文献编号：T-1\n> 解读人：Arise\n---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | High‑intensity interval training for reducing cardiometabolic syndrome in healthy but sedentary populations |\n| 中文标题 | 高强度间歇训练改善健康但久坐成人心血管代谢综合征的效果 |\n| 作者 | Strauss JA, Kirwan R, Ranasinghe C, Schwingshackl L, Shepherd SO, Chaplin M, Sguassero Y, Petkovic J, Villanueva G, Dwan K |\n| 期刊 | *Cochrane Database of Systematic Reviews*（考克兰系统综述数据库） |\n| 发表日期 | 2026年3月11日 |\n| 卷期 | 2026年第3期，文章编号 CD013617 |\n| DOI | [10.1002/14651858.CD013617.pub2](https://doi.org/10.1002/14651858.CD013617.pub2) |\n| 文献类型 | 系统综述与荟萃分析（Systematic Review / Meta‑analysis, SR/MA）——Cochrane官方综述 |\n| 纳入研究 | 58 项随机对照试验（Randomized Controlled Trial, RCT） |\n| 总样本量 | 2,075 名健康但久坐的成人 |\n| 干预周期 | 4 ~ 16 周 |\n---"}, {"id": 22, "date": "2026-06-19", "author": "Fraser Thurlow", "year": "2026", "title": "短间歇 HIIT 急性生理与感知效应 —— 系统综述与荟萃分析", "type": "SR/MA", "journal": "*Sports Medicine*（运动医学, Sports Medicine）", "doi": "", "conclusion": "先给你一组核心数据，短间歇 HIIT 的整体负荷有多大：\n平均心率达到最大心率的 88%，峰值心率 94%；\n平均摄氧量是最大摄氧量的 78%，峰值接近 93%；\n高于 90% 最大摄氧量的时间有 259 秒，占总运动时间的 34%；\n血乳酸 8.3 毫摩尔每升，远超乳酸阈值；\n主观疲劳感 sRPE 是 7.1 分，也就是「非常吃力」的水平。\n一句话：短间歇 HIIT 是实打实的高强度训练，有氧无氧双重刺激。\n然后是最实用的——各个训练变量的影响：\n第一个，折返跑还是直线跑？折返跑的血乳酸比直线跑高 1.9 毫摩尔，主观疲劳感高 1.7 分。也就是说，折返跑无氧刺激更强，但也更累。", "full_text": "---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | The Acute Effects of Short-Bout High-Intensity Interval Training on Physiological and Perceptual Outcomes: A Systematic Review and Meta-analysis |\n| 中文译名 | 短间歇高强度间歇训练对生理与感知结局的急性影响：系统综述与荟萃分析 |\n| 第一作者 | Fraser Thurlow |\n| 通讯作者 | Jonathon Weakley |\n| 期刊 | *Sports Medicine*（运动医学, Sports Medicine） |\n| 发表时间 | 2026 年 5 月（在线优先发表） |\n| DOI（数字对象唯一标识符, Digital Object Identifier, DOI） | 10.1007/s40279-026-02456-x |\n| PMID（PubMed 唯一标识符, PubMed ID, PMID） | 42171971 |\n| 文献类型 | SR/MA（系统综述与荟萃分析, Systematic Review / Meta-Analysis, SR/MA） |\n| 研究注册 | Open Science Framework（OSF） |\n| 纳入研究 | 46 项研究，139 个数据样本，681 名运动员，117 种训练方案 |\n---"}, {"id": 23, "date": "2026-06-20", "author": "", "year": "2026", "title": "Li 2026 HIIT对糖尿病前期成人血糖控制的系统综述与荟萃分析", "type": "SR/MA", "journal": "*Frontiers in Endocrinology*（内分泌学前沿）", "doi": "10.3389/fendo.2026.1837386 |", "conclusion": "", "full_text": "---\n## 一、文献基本信息\n| 项目 | 详情 |\n|------|------|\n| 标题 | Effects of high-intensity interval training on glycemic control and cardiometabolic risk factors in adults with prediabetes: a systematic review and meta-analysis |\n| 中文译名 | 高强度间歇训练对糖尿病前期成人血糖控制及心血管代谢风险因素的影响：一项系统评价和荟萃分析 |\n| 作者 | Jun Li, Jin Yuan, Haifeng Ma（通讯作者） |\n| 期刊 | *Frontiers in Endocrinology*（内分泌学前沿） |\n| 发表年份 | 2026 |\n| DOI | 10.3389/fendo.2026.1837386 |\n| PROSPERO注册号 | CRD42024605154 |\n| 文献类型 | 系统综述与荟萃分析（Systematic Review / Meta-Analysis, SR/MA） |\n| 检索时间 | 建库至2026年1月 |\n---"}, {"id": 24, "date": "2026-06-21", "author": "", "year": "2026", "title": "运动降血压的\"黄金组合\"与最优剂量：105项RCT的网络荟萃分析解读", "type": "SR/MA", "journal": "*Journal of the American Heart Association*（JAHA，美国心脏协会杂志）", "doi": "[10.1161/JAHA.125.044003](https://doi.org/10.1161/JAHA.125.044003) |", "conclusion": "1. 低剂量区间（<52 MET-min/周）：\n   - 血压开始出现有统计学意义的降低\n   - 即使少量运动也能带来健康获益\n   - 约相当于每周15分钟的快走（3.3 METs强度）\n2. 最优剂量区间（≈830 MET-min/周）：\n   - 降压效果达到峰值\n   - 约相当于每周250分钟的中等强度快走\n   - 或每周约150分钟的较高强度运动\n3. 高剂量区间（>830 MET-min/周）：\n   - 继续增加运动量，降压效果不再提升\n   - 甚至可能出现边际效益递减\n   - 过高剂量是否有害尚未明确", "full_text": "解读日期： 2026-06-21\n文献编号： T-13\n领域分类： 训练-心血管健康/高血压管理\n---\n## 一、文献基本信息\n| 项目 | 详情 |\n|------|------|\n| 标题 | Optimal Exercise Modalities and Dosages for Blood Pressure Reduction in Adults With Prehypertension and Established Hypertension: A Network Meta‐Analysis and Dose–Response Relationship Study |\n| 中文标题 | 成人高血压前期与确诊高血压的最佳运动方式与剂量：网络荟萃分析与剂量反应研究 |\n| 作者 | Xianyang Xin, PhD; Yongqing Guo, PhD; Mei Wang, MPH; Zhongxu Hu, MPH; Jiu Chen, PhD; Jun Xie, PhD |\n| 通讯作者 | Jun Xie, PhD（解军） |\n| 期刊 | *Journal of the American Heart Association*（JAHA，美国心脏协会杂志） |\n| 发表日期 | 2026年5月14日 |\n| DOI | [10.1161/JAHA.125.044003](https://doi.org/10.1161/JAHA.125.044003) |\n| 文献类型 | 系统综述 + 贝叶斯网络荟萃分析（Systematic Review + Bayesian Network Meta-Analysis, SR + NMA） |\n| 注册信息 | PROSPERO（前瞻性系统综述注册库, International Prospective Register of Systematic Reviews, PROSPERO）注册号：CRD420251027357 |\n| 研究资助 | 待核实 |\n---"}, {"id": 25, "date": "2026-06-22", "author": "", "year": "2026", "title": "对抗肌少症的最优方案：235项RCT的网络荟萃分析解读", "type": "SR/MA", "journal": "*Nutrients*（营养素）", "doi": "[10.3390/nu18091409](https://doi.org/10.3390/nu18091409) |", "conclusion": "好，重点来了。这篇研究最核心的发现是什么？\n第一，增肌增力的黄金组合是乳清蛋白加抗阻训练。\n对于增加肌肉量，乳清蛋白加抗阻训练的效果排在第一位，效应量SMD达到1.29，属于大效应。什么概念呢？就是比不干预的人平均多长2.5到3公斤的瘦体重。排第二的是牛奶蛋白加抗阻训练，第三是大豆蛋白加抗阻训练。\n对于增加腿力，排名也是一样的，乳清蛋白加抗阻训练效应量1.16，也是大效应。握力的结果类似。\n这里有个很重要的点：单独补蛋白不运动，效果非常有限，SMD只有0.2到0.3，也就是小效应。单独运动不补蛋白，有效果但没达到最大化。只有两个加在一起，才能产生1+1大于2的协同效应。\n所以", "full_text": "解读日期： 2026-06-22\n文献编号： N-13\n领域分类： 运动营养-肌少症\n---\n## 一、文献基本信息\n| 项目 | 详情 |\n|------|------|\n| 标题 | Explore the Optimal Treatment Regimen Across Combinations of Variate Protein Sources and Exercise Modalities and Its Associated Factors in Older Adults: A Network Meta-Analysis and Meta-Regression of Randomized Controlled Trials |\n| 中文标题 | 老年人不同蛋白来源与运动方式组合的最优治疗方案探索：随机对照试验的网络荟萃分析与荟萃回归 |\n| 作者 | Che-Li Lin, Shih-Wei Huang, Hung-Chou Chen, Mao-Hua Huang, Tsan-Hon Liou, Chun-De Liao |\n| 通讯作者 | Chun-De Liao（廖俊德） |\n| 机构 | 台北医学大学（Taipei Medical University） |\n| 期刊 | *Nutrients*（营养素） |\n| 发表日期 | 2026年4月29日 |\n| 卷期页码 | 18(9):1409 |\n| DOI | [10.3390/nu18091409](https://doi.org/10.3390/nu18091409) |\n| 文献类型 | 系统综述 + 贝叶斯网络荟萃分析（Systematic Review + Network Meta-Analysis, NMA）+ 荟萃回归 |\n| 注册信息 | PROSPERO（前瞻性系统综述注册库, International Prospective Register of Systematic Reviews, PROSPERO）注册号：CRD42023472942 |\n| 影响因子 | 约4.2（2024年） |\n| JCR分区 | Q1（营养学） |\n---"}, {"id": 26, "date": "2026-06-23", "author": "", "year": "2026", "title": "同时训练真的会互相干扰吗？17项荟萃分析的伞评给出答案", "type": "伞评", "journal": "*Sports Medicine*（运动医学）", "doi": "[10.1007/s40279-026-02401-y](https://doi.org/10.1007/s40279-026-02401-y) |", "conclusion": "【研究方法与样本量（30秒）】\n简单说一下研究怎么做的。所谓伞评，就是把已经发表的所有荟萃分析收集起来，做一个系统综述的综述，相当于站在所有前人研究的肩膀上看问题，证据等级是最高的。\n纳入的研究对象都是健康成年人，从新手到有训练经验的人都有。干预方式就是同时进行力量和有氧训练，和只做力量或者只做有氧对比。结局指标包括最大力量、肌肉肥大、有氧能力和功率输出。\n【核心结论（80秒）】\n好，重点来了。这篇伞评最核心的发现是什么？我总结了四个关键点。\n第一，同时训练不会掉肌肉、不会掉力量。\n和只做力量训练相比，同时训练的肌肉肥大效果几乎没有差别，效应量SMD只有-0", "full_text": "解读日期： 2026-06-23\n文献编号： T-14\n领域分类： 训练-力量/有氧-同时训练\n---\n## 一、文献基本信息\n| 项目 | 详情 |\n|------|------|\n| 标题 | Maximizing Adaptations in Concurrent Training: An Umbrella Review of Meta-analyses |\n| 中文标题 | 同时训练适应最大化：荟萃分析的伞评 |\n| 作者 | Steffen Held, Lena Wolf, Ludwig Rappelt, Wilhelm Bloch, Lars Donath, Florian Micke, Stephan Geisler, Eduard Isenmann |\n| 通讯作者 | Steffen Held |\n| 机构 | IST应用科学大学管理与体育系（德国杜塞尔多夫）；德国科隆体育大学分子与细胞运动医学系 |\n| 期刊 | *Sports Medicine*（运动医学） |\n| 发表日期 | 2026年2月28日（在线发表）；2026年6月（正式出版） |\n| 卷期页码 | 56(6):1489-1512 |\n| DOI | [10.1007/s40279-026-02401-y](https://doi.org/10.1007/s40279-026-02401-y) |\n| 文献类型 | 伞评（Umbrella Review）—— 系统综述的系统综述 |\n| 注册信息 | 前瞻性系统综述注册库（International Prospective Register of Systematic Reviews, PROSPERO）注册号：CRD42025646460 |\n| 影响因子 | 约8.7（2024年） |\n| JCR分区 | Q1（运动科学） |\n---"}, {"id": 27, "date": "2026-06-23", "author": "", "year": "2026", "title": "[Zhang 2026] 长期抗阻训练与全因和特因死亡率：剂量反应及与有氧体力活动的联合关联", "type": "解读", "journal": "", "doi": "", "conclusion": "", "full_text": ""}, {"id": 28, "date": "2026-06-25", "author": "", "year": "2026", "title": "[Minahan 2026] 运动压力下的表现：澳大利亚运动与体育科学学会（ESSA）立场声明", "type": "解读", "journal": "", "doi  "RCT", "journal": "*Journal of Medical Internet Research* (JMIR)", "doi": "10.2196/91751 |", "conclusion": "### 期刊基本信息\n- 期刊名称：*Journal of Medical Internet Research- (JMIR)\n- 中文译名：《医学互联网研究杂志》\n- 出版商：JMIR Publications Inc.（加拿大）\n- 创刊时间：1999年\n- 期刊类型：开放获取同行评议期刊\n- 覆盖领域：数字健康、医学信息学、移动医疗、电子健康、远程医疗等\n- 出版频率：连续出版（按月归档）", "full_text": "> 解读日期：2026-06-27\n> 文献编号：H-22\n> 领域：大健康-心理健康/正念\n> 解读人：Arise\n---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Self-guided internet-based mindfulness-informed stress management for generalized anxiety disorder: a randomized controlled trial with longitudinal network analysis |\n| 中文标题 | 自助式网络正念压力管理治疗广泛性焦虑障碍：一项带纵向网络分析的随机对照试验 |\n| 作者 | Wang Z, Yang Y, et al. |\n| 通讯作者 | Yang Yuan（杨远） |\n| 机构 | 华中科技大学同济医学院附属同济医院神经内科/精神科 |\n| 期刊 | *Journal of Medical Internet Research* (JMIR) |\n| 发表日期 | 2026年 |\n| DOI | 10.2196/91751 |\n| 文献类型 | 随机对照试验（RCT）+ 纵向网络分析 |\n| 样本量 | 140名GAD患者 |\n| 研究对象 | 18-65岁广泛性焦虑障碍（GAD）患者 |\n| 影响因子 | 约5.0-5.5（2024年JCR） |\n| JCR分区 | Q1（医学信息学/卫生保健） |\n---"}, {"id": 40, "date": "2026-06-29", "author": "", "year": "2026", "title": "每日体力活动与表观遗传衰老——《柳叶刀·老龄健康》系统综述与荟萃分析", "type": "SR/MA", "journal": "*The Lancet Healthy Longevity*（《柳叶刀·老龄健康》）", "doi": "[10.1016/j.lanhl.2026.100835](https://doi.org/10.1016/j.lanhl.2026.100835) |", "conclusion": "- 读文献时要时刻问自己：这是关联还是因果？研究设计支持什么样的结论？\n2. 表观遗传时钟不是一个单一的概念\n- 不同的时钟有不同的生物学意义，对不同的干预有不同的敏感性\n- Horvath 时钟更偏向\"时序年龄预测器\"，GrimAge 更偏向\"死亡风险预测器\"\n- 选择什么时钟作为研究终点，取决于你要回答什么科学问题\n- 不要笼统地说\"生物年龄\"，要具体说明是哪种时钟测得的\n3. 运动科学的证据等级普遍不高，这是领域特点\n- 运动干预研究难做盲法、难控制混杂、样本量通常不大\n- 但这不等于运动科学\"不科学\"，而是说明这个领域有其独特的方法学挑战\n- 作为从业者，要理解证据", "full_text": "> 解读日期：2026-06-29\n> 文献编号：T-24\n> 解读人：Arise\n---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Physical activity and the epigenetic clock: a systematic review and meta-analysis |\n| 中文标题 | 体力活动与表观遗传时钟：系统综述与荟萃分析 |\n| 作者 | 新加坡国立大学（National University of Singapore）研究团队 |\n| 期刊 | *The Lancet Healthy Longevity*（《柳叶刀·老龄健康》） |\n| 发表日期 | 2026年4月30日在线发表 |\n| DOI | [10.1016/j.lanhl.2026.100835](https://doi.org/10.1016/j.lanhl.2026.100835) |\n| 文献类型 | 系统综述与荟萃分析（Systematic Review / Meta‑analysis, SR/MA） |\n| 纳入研究 | 44 项观察性研究（横断面 + 队列）；其中 7 项横断面研究纳入 Meta 分析 |\n| 总样本量 | 145,465 名参与者 |\n| 年龄范围 | 平均年龄 24 ~ 78.5 岁 |\n> ⚠️ 注：第一作者及通讯作者的具体姓名在公开摘要中未明确标注，从研究机构推断为新加坡国立大学Saw Swee Hock公共卫生学院研究团队。该研究被美国知名医生Eric Topol在社交媒体上推荐，受到广泛关注。\n---"}, {"id": 41, "date": "2026-07-02", "author": "Sidong Li（李思栋）", "year": "2026", "title": "[Li 2026] 每日复合维生素补充对表观遗传衰老时钟的影响：COSMOS随机临床试验2年结果", "type": "RCT", "journal": "*Nature Medicine*（自然·医学）", "doi": "10.1038/s41591-026-04239-3 |", "conclusion": "> 每日一片复合维生素（善存银片）可在2年内轻微但统计显著地减缓老年人的表观遗传衰老速度（第二代时钟），基线生物学年龄加速者获益更明显；可可黄烷醇补充无此作用。", "full_text": "---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 原文标题 | Effects of daily multivitamin-multimineral and cocoa extract supplementation on epigenetic aging clocks in the COSMOS randomized clinical trial |\n| 第一作者 | Sidong Li（李思栋） |\n| 通讯作者 | Howard D. Sesso |\n| 期刊 | *Nature Medicine*（自然·医学） |\n| 发表年份 | 2026 |\n| DOI | 10.1038/s41591-026-04239-3 |\n| PMID | 41803341 |\n| 文献类型 | 随机对照试验（Randomized Controlled Trial, RCT）——预设辅助研究 |\n| 研究领域 | 营养与衰老 / 表观遗传学 / 预防医学 |\n---"}, {"id": 42, "date": "2026-07-03", "author": "", "year": "2026", "title": "抗阻训练剂量反应——每周容量与频率对肌肥大与力量增长的meta回归分析", "type": "解读", "journal": "*Sports Medicine*（《运动医学》，IF ≈ 18.5，Q1）", "doi": "10.1007/s40279-025-02344-w |", "conclusion": "", "full_text": "> 解读日期：2026-07-03\n> 文献编号：T-26\n> 解读人：Arise\n---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | The Resistance Training Dose Response: Meta-Regressions Exploring the Effects of Weekly Volume and Frequency on Muscle Hypertrophy and Strength Gains |\n| 中文译名 | 抗阻训练剂量反应：每周容量与频率对肌肉肥大与力量增长影响的meta回归分析 |\n| 作者 | Joshua C. Pelland, Jacob F. Remmert, Zac P. Robinson, Seth R. Hinson, Michael C. Zourdos |\n| 通讯作者 | Michael C. Zourdos（佛罗里达大西洋大学肌肉生理实验室） |\n| 期刊 | *Sports Medicine*（《运动医学》，IF ≈ 18.5，Q1） |\n| 发表日期 | 2026年2月（卷56，页481-505） |\n| DOI | 10.1007/s40279-025-02344-w |\n| PMID | 41 | The Effect of Carbohydrate Intake on Muscle Hypertrophy: A Systematic Review and Meta-analysis |\n| 作者 | Menno Henselmans, Fredrik Tonstad Vårvik, Mikel Izquierdo（共 3 人） |\n| 期刊 | *Sports Medicine*（Springer），IF ≈ 10.2，JCR Q1 |\n| 发表日期 | 2026-02（Online first） |\n| 卷期 | Vol. 56, pp. 691–702 |\n| DOI | 10.1007/s40279-025-02341-z |\n| PMID | 41712097 |\n| PROSPERO | CRD42024589461 |\n| 文献类型 | 系统综述与荟萃分析（Systematic Review / Meta-Analysis, SR/MA） |\n---"}, {"id": 62, "date": "2026-08-03", "author": "Xinyu Shen（沈新宇）", "year": "2026", "title": "Shen 2026 — 10种运动干预对代谢综合征各指标的差异化效应：网状荟萃分析", "type": "SR/MA", "journal": "*iScience*（Cell Press 旗下交叉科学期刊）|", "doi": "10.1016/j.isci.2026.116801 |", "conclusion": "", "full_text": ""}, {"id": 63, "date": "2026-08-05", "author": "Tim Havers（慕尼黑工业大学 运动与健康科学系 / IST应用科技大学 健身与健康系）", "year": "2026", "title": "Havers 2026 — 降组训练的急性与慢性效应：不增肌、不增力、但省时间的系统评价与元分析", "type": "SR/MA", "journal": "Sports Medicine - Open（IF ≈ 4.7，Q1 运动科学）", "doi": "10.1186/s40798-026-01012-1 |", "conclusion": "", "full_text": ""}, {"id": 64, "date": "2026-08-06", "author": "Julio Fernandez-Garrido（julio.fernandez@uv.es）", "year": "2026", "title": "每日文献解读 · Fernandez-Garrido 2026", "type": "RCT", "journal": "*Experimental Gerontology*（实验老年学）", "doi": "10.1016/j.exger.2026.113122 |", "conclusion": "", "full_text": ""}, {"id": 65, "date": "2026-08-07", "author": "Joshua C Pelland", "year": "2026", "title": "每日文献解读 · Pelland 2026", "type": "解读", "journal": "*Sports Medicine*（运动医学）", "doi": "10.1007/s40279-025-02344-w |", "conclusion": "", "full_text": ""}, {"id": 66, "date": "2026-08-08", "author": "", "year": "2026", "title": "全血 NAD⁺ 水平不随年龄下降——七项独立队列的循证挑战", "type": "SR/MA", "journal": "Nature Metabolism（自然·代谢）", "doi": "10.1038/s42255-026-01537-5 |", "conclusion": "3. 商业叙事 vs 循证判断：NAD⁺补充剂产业估值数十亿美元。当核心前提被Nature子刊挑战时，需要区分\"前提被否定\"和\"整个领域被否定\"——组织NAD⁺下降的证据（来自皮肤/肌肉活检/MRS成像）并未被本文推翻。", "full_text": "---\n## 一、文献基本信息\n| 项目 | 内容 |\n|------|------|\n| 标题 | Human whole-blood NAD⁺ levels do not vary with age or lifestyle interventions |\n| 中文译名 | 人体全血烟酰胺腺嘌呤二核苷酸（NAD⁺）水平不随年龄或生活方式干预而变化 |\n| 作者 | Trętowicz MM, Scantlebery AML, Schomakers BV, Eroğlu KD, van Weeghel M, Spek V, Vinten KT, Legon L, Coskun E, Millan-Domingo F, Olaso-Gonzalez G, Gomez-Cabrera MC, Montoro-García S, Noguera-Navarro C, van Kuilenburg ABP, Moco S, van Hattum JC, Jørstad HT, Benali M, van der Helder J, Biersteker EJM, Muniandy M, Pietiläinen KH, Pirinen E, Slagboom PE, Beekman M, Deelen J, Zapata-Pérez R, Weijs PJM, Tieland M, Janssens GE, Houtkooper RH |\n| 通讯作者 | Riekelt H Houtkooper（r.h.houtkooper@amsterdamumc.nl）；Georges E Janssens（g.e.janssens@amsterdamumc.nl） |\n| 期刊 | Nature Metabolism（自然·代谢） |\n| 发表日期 | 2026-05-14（在线）；2026年6月（印刷版 8(6):1282-1290） |\n| DOI | 10.1038/s42255-026-01537-5 |\n| PMID | 42135539 |\n| 文献类型 | 多队列横断面分析（Multi-Cohort Cross-Sectional Analysis）——非系统综述（SR）、非荟萃分析（MA）、非随机对照试验（RCT） |\n| 反编造核证 | DOI / PMID / 32位作者 / 23个机构 / 7队列 / 300+人 / 全文摘要——PubMed官方页 + Nature Publishing Group期刊页 + NutraIngredients独立报道 三源核证一致 |\n---"}, {"id": 67, "date": "2026-08-09", "author": "", "year": "2026", "title": "每日文献解读 T-136：抗阻×增强式联合训练模态对纵跳与短跑的效应 · 贝叶斯网状荟萃分析", "type": "SR/MA", "journal": "BMC Sports Science, Medicine and Rehabilitation（BMC 运动科学、医学与康复杂志）", "doi": "10.1186/s13102-026-01531-0 |", "conclusion": "", "full_text": ""}, {"id": 68, "date": "2026-08-10", "author": "Zhijian He（何志坚），Lanzhou University（兰州大学）& Beijing Sport University（北京体育大学）", "year": "2026", "title": "H-58 He 2026 等长收缩预激活增强效应（PAPE）系统综述与三级荟萃分析", "type": "SR/MA", "journal": "European Journal of Sport Science（欧洲运动科学杂志，EJSS），IF = 3.0，Q1（Orthopedics and Sports Medicine），ECSS（欧洲运动科学学会）官方期刊", "doi": "10.1002/ejsc.70183 |", "conclusion": "", "full_text": ""}, {"id": 69, "date": "2026-08-11", "author": "Xing Zhang（张星），University of Granada（格拉纳达大学），Spain", "year": "2026", "title": "Zhang X / Weakley J / García-Ramos A 2026 Sports Medicine 强调性离心负荷 vs 恒定负荷抗阻训练急慢性效应 系统综述与荟萃分析", "type": "SR/MA", "journal": "Sports Medicine（运动医学），IF ≈ 10.2，Q1（Orthopedics and Sports Medicine），运动科学领域顶刊", "doi": "10.1007/s40279-026-02422-7 |", "conclusion": "", "full_text": ""}, {"id": 70, "date": "2026-08-12", "author": "Takahisa Ohta（大田隆久），Tokyo Metropolitan Institute for Geriatrics and Gerontology（东京都健康长寿医疗中心研究所），Japan", "year": "2026", "title": "Ohta T / Hatanaka S / Osuka Y（通讯）2026 Ageing Research Reviews 运动与营养干预对老年人肌肉特异性力量效应 系统综述与荟萃分析", "type": "SR/MA", "journal": "Ageing Research Reviews（老龄研究综述），IF ≈ 12.5，Q1（Gerontology / Geriatrics and Gerontology），老年医学领域顶刊", "doi": "10.1016/j.arr.2026.103271 |", "conclusion": "", "full_text": ""}, {"id": 71, "date": "2026-08-13", "author": "", "year": "2026", "title": "青少年运动员急性咖啡因摄入的运动表现效应与安全性——系统综述与三级荟萃分析", "type": "SR/MA", "journal": "Nutrients（《营养素》），MDPI 出版，EISSN 2072-6643", "doi": "10.3390/nu18152520 |", "conclusion": "", "full_text": ""}, {"id": 72, "date": "2026-08-14", "author": "Guan L（关琳，⚠️ 待核证中文姓名）", "year": "2026", "title": "T-147 Guan & Fan 2026 JISSN 血清素能药物操纵对运动表现与中枢疲劳效应 系统综述 + 三水平荟萃分析 深度解读", "type": "SR/MA", "journal": "Journal of the International Society of Sports Nutrition（国际运动营养学会期刊, JISSN）", "doi": "10.1080/15502783.2026.2692017 |", "conclusion": "", "full_text": ""}, {"id": 73, "date": "2026-08-15", "author": "", "year": "2026", "title": "文献深度解读：LaMonte et al. 2026 — 老年女性肌肉力量与死亡率", "type": "解读", "journal": "", "doi": "", "conclusion": "| Competing explanations（竞争性解释） | ①反向因果：基础疾病同时导致低力量和高死亡率；②残余混杂：更强的人可能在其他未测量的健康行为上也更好；③遗传第三方变量：某些基因同时影响肌肉功能和寿命 |", "full_text": "> 文献编号：T-143\n> 解读日期：2026-08-15\n> 解读人：Arise（运动科学内容审查高级研究助理）\n> 模板版本：v2（2026-08-14 确认）\n---\n## 一、研究问题\n### 1.1 这篇研究到底想解决什么问题？\n肌肉力量（muscular strength）是否与全因死亡率（all-cause mortality）独立相关？这种关联是否独立于加速度计客观测量的体力活动（physical activity, PA）、久坐时间（sedentary time）、步行速度（walking speed）和全身性炎症标志物（systemic inflammation）？\n### 1.2 PICO/PECO\n| 要素 | 内容 |\n|------|------|\n| P（人群） | 5,472 名可步行的老年女性，年龄 63–99 岁（均值 78.7 ± 6.7 岁），来自 OPACH 研究（Objective Physical Activity and Cardiovascular Health），WHI（Women's Health Initiative 女性健康倡议）子队列 |\n| I/E（暴露） | ①优势手握力（grip strength），以手部握力计测量，按四分位分组：Q1 < 14 kg，Q2 14–19 kg，Q3 19–24 kg，Q4 > 24 kg；②5 次无辅助椅子站立测试时间（chair stand time），按四分位分组：Q1 > 16.7 s，Q2 13.7–16.6 s，Q3 11.2–13.6 s，Q4 ≤ 11.1 s |\n| C（对照） | 各指标最低四分位（Q1） |\n| O（结局） | 全因死亡率（all-cause mortality），通过死亡记录确认 |\n### 1.3 研究设计\n前瞻性队列研究（prospective cohort）。基线时间 2012 年 3 月至 2014 年 4 月，随访截止 2023 年 2 月 19 日。中位随访 8.4（SD 2.4）年。\n能回答什么：\n- 肌肉力量与全因死亡率的独立关联（剂量反应关系）\n- 该关联是否独立于客观 PA、久坐、步行速度和炎症\n- 亚组一致性（年龄/种族/BMI/PA 水平/久坐时间/步行速度）\n不能回答什么：\n- 因果关系——观察性设计无法建立因果\n- 力量训练干预能否降低死亡率——本文测量的是力量状态，不是训练行为\n- 男性是否相同——本研究仅女性\n- 力量测量的改善（通过训练）是否带来死亡率降低——仅基线单次测量\n### 1.4 研究类型与核心参数\n| 参数 | 值 |\n|------|-----|\n| 研究类型 | 前瞻性队列（prospective cohort） |\n| 样本量 | 5,472 名女性 |\n| 性别 | "}, {"id": 74, "date": "2026-08-16", "author": "", "year": "2026", "title": "Gois & Carvalho 2026：联合有氧和抗阻训练对冠心病患者运动能力、肌力、生活质量与死亡率的效应——系统综述与荟萃分析", "type": "SR/MA", "journal": "", "doi": "", "conclusion": "联合有氧和抗阻训练（CART）在改善 CHD 患者心肺功能、肌力、生活质量和降低死亡率方面优于不运动或单纯有氧训练，为心脏康复方案应包含力量成分提供了迄今最大规模的 RCT 汇总证据。", "full_text": "> 文献编号: T-145\n> 解读日期: 2026-08-16\n> 解读稿版本: v1.0\n---\n## 一、研究问题\n### 1.1 这篇研究想解决什么问题？\n冠心病（Coronary Heart Disease, CHD）是全球首位死因。运动训练是心脏康复（Cardiac Rehabilitation, CR）的核心组成部分。有氧训练（Aerobic Training, AT）是心血管康复中研究最多的干预类型，获得 Class IA 推荐。然而，抗阻训练（Resistance Training, RT）在心脏康复中的附加价值——尤其是联合有氧和抗阻训练（Combined Aerobic and Resistance Training, CART）相对于单一运动模式的增量效益——此前未被充分系统综合。\n本研究回答的核心问题：在 CHD 患者中，CART 相对于（a）不运动常规护理、（b）单纯有氧训练、（c）单纯抗阻训练，在运动能力、肌力、生活质量和死亡率方面是否存在显著差异？\n### 1.2 PICO 要素\n| 要素 | 内容 |\n|------|------|\n| P（人群） | CHD 患者（任何性别和年龄，有心绞痛/心梗病史，血管造影证实和/或经皮冠状动脉介入治疗） |\n| I（干预） | 联合有氧和抗阻训练（CART） |\n| C（对照） | 三种：①不运动常规护理（UC）；②单纯有氧训练（AT）；③单纯抗阻训练（RT） |\n| O（结局） | 运动能力：peak VO₂（ml/kg/min）、6MWD（m）；肌力：1-RM（kg）、峰值扭矩（N.m）、握力（kgf）；HRQoL（SF-36/EuroQol/MacNew/WHOQOL-BREF）；死亡率（心脏死亡 + 全因死亡） |\n| S（研究设计） | 仅纳入 RCT |\n### 1.3 能回答什么 / 不能回答什么\n能回答：\n- CART 是否在多个功能维度上优于不运动/单一运动模式\n- CART 对硬终点（死亡率）的效应大小\n- 增量效益的量级（SMD/MD + 95%CI）\n不能回答：\n- 最优训练编排参数（频率/强度/动作选择/周期化方案）\n- CART 对不同 CHD 亚群（STEMI vs NSTEMI vs 稳定型心绞痛）的差异化效应\n- 长期（>2 年）安全性数据\n- 女性亚组的充分分析（仅 23.4% 女性）\n### 1.4 SR/MA 方法学细节\n| 条目 | 报告 |\n|------|------|\n| 数据库 | MEDLINE/PubMed、Scopus、Cochrane Central、EMBASE + 灰色文献（Google Scholar、OpenThesis） |\n| 检索截止 | 2026 年 5 月 |\n| 纳入研究 | 61 项 RCT |\n| 总样本"}, {"id": 75, "date": "2026-08-17", "author": "", "year": "2026", "title": "全食物饮食干预对社区老年人蛋白摄入的效应：系统综述与荟萃分析深度解读", "type": "SR/MA", "journal": "", "doi": "", "conclusion": "全食物饮食干预可有效增加社区老年人蛋白摄入量（+12.2 g/d），成功干预的特征是干预时长 >3 个月、个体化咨询、面对面交付和设定绝对蛋白目标。", "full_text": "> 文献编号: N-44\n> 解读日期: 2026-08-17\n> 解读人: Arise\n> 文献来源: 已入库元数据卡（2026-08-06 入库批次）\n---\n## 一、核心文献 + 同级证据联合解读\n### 1. 研究问题\n这篇研究到底想解决什么问题？\n老年人普遍存在蛋白摄入不足的问题——全球估计 14%–30% 的成年人蛋白摄入低于 WHO 推荐的 0.8 g/kg/d，若按 ESPEN 推荐的 1.0–1.2 g/kg/d 计算，不足比例高达 38%–55%。蛋白补剂（如乳清蛋白粉）虽然能有效增加蛋白摄入，但效果往往是暂时的，且老年人更偏好全食物而非补剂。\nPICO/PECO:\n- Population: 社区居住老年人（≥50 岁），排除住院、机构照护、重大疾病患者\n- Intervention: 全食物饮食干预（基于真实食物的饮食咨询或处方，非蛋白补剂），干预时长 ≥12 周\n- Comparison: 对照组（无饮食干预或仅运动干预）\n- Outcome: 蛋白摄入量变化（g/d 或 g/kg/d）\n研究设计: 系统综述 + 随机效应荟萃分析（SR/MA）\n能回答什么:\n- 全食物饮食干预能否有效增加老年人蛋白摄入\n- 哪些干预特征（时长、交付方式、蛋白目标设定等）与干预成功相关\n不能回答什么:\n- 蛋白摄入增加后是否转化为肌肉质量、力量或功能改善\n- 全食物 vs 蛋白补剂的直接比较（本文排除了补剂研究）\n- 不同全食物来源（肉类 vs 乳制品 vs 植物蛋白）的相对效果\n基本信息:\n- 研究类型: SR/MA\n- 纳入研究数: 16 项（SR）/ 11 项（MA）\n- 总样本量: 1,712 人（SR）/ 1,207 人（MA）\n- 性别比例: 33% 男性 / 67% 女性\n- 年龄: ≥50 岁（社区居住老年人）\n- 干预: 全食物饮食干预（基于真实食物，如牛奶、瘦肉、鸡蛋、植物蛋白食品等）\n- 对照: 无干预或仅运动\n- 主要结局: 蛋白摄入量（g/d 和 g/kg/d）\n- 随访: 干预时长 ≥12 周（多数 3–6 个月）\n- 测量方法: 食物日记（10 项）/ 食物频率问卷（4 项）/ 24 小时尿氮（1 项）/ 简要饮食史（1 项）\nSR/MA 额外信息:\n- 数据库: PubMed / Embase / Web of Science\n- 检索时间: 建库至 2023 年 12 月 7 日，更新至 2024 年 9 月 6 日\n- 纳入排除标准: 全食物干预（排除蛋白补剂）、≥50 岁社区老年人、≥12 周、报告蛋白摄入量\n- 预注册: PROSPERO CRD42023491283\n- PRISMA: 符合\n- 效应模型: 随机效应模型\n- 异质性: I² 和 τ² 报告（待原文 PDF 二次核证具体数值）\n- 亚组/敏感"}, {"id": 76, "date": "2026-08-18", "author": "", "year": "2026", "title": "元数据卡：T-150", "type": "SR/MA", "journal": "", "doi": "", "conclusion": "", "full_text": ""}, {"id": 77, "date": "2026-08-25", "author": "", "year": "2026", "title": "Singh B / Maher CA（通讯）2026 JAACAP — 运动对儿童青少年抑郁与焦虑症状的效应：系统伞状综述与元元分析", "type": "解读", "journal": "", "doi": "", "conclusion": "", "full_text": ""}, {"id": 78, "date": "2026-08-26", "author": "", "year": "2026", "title": "Adugna DG / Kidgell DJ（通讯）2026 Neurobiology of Aging", "type": "SR/MA", "journal": "", "doi": "", "conclusion": "衰老伴随运动单位放电率降低（尤其高力量时）、放电变异增大和募集阈值改变，这些神经层面变化可能是老年人力量下降的贡献因素之一，但横断面设计无法确定因果方向。", "full_text": "> 解读日期：2026-08-26\n> 解读文件：`循证力量训练/04_每日文献/2026-08-26_Adugna2026_运动单位衰老SRMA_T146_文献解读.md`\n> 文献编号：T-146\n> DOI: 10.1016/j.neurobiolaging.2026.07.008 / PMID: 42520337\n> Neurobiology of Aging 2026; Vol. 168, pp. 73-89（Epub 2026-07）\n> IF ≈ 3.7（Neurobiology of Aging）\n---\n## 一、研究问题\n### 这篇研究想回答什么\n衰老导致最大力量下降是确定事实。但力量下降中，有多少来自肌肉本身（肌纤维萎缩、类型转换），有多少来自神经驱动的变化（运动单位放电率降低、募集模式改变），至今缺乏定量综合。\n运动单位（motor unit, MU）——一个α运动神经元（alpha motor neuron, αMN）加上其支配的全部肌纤维——是力量产生的\"最终共同通路\"。运动单位的行为通过三个核心变量描述：\n- 放电率（motor unit discharge rate, MUDR）：运动神经元发放动作电位的频率（pulses per second, pps），通过速率编码（rate coding）调节力量输出\n- 募集阈值（motor unit recruitment threshold, MURT）：运动单位被激活所需的力量水平，反映有序募集（orderly recruitment）\n- 放电率变异（motor unit discharge rate variability, MUDRV）：放电间隔的变异系数，反映运动神经元输出的稳定性\n此前不同研究之间结果不一致。本系统综述/荟萃分析首次在同一框架内同时量化这四个核心指标（MUDR、MUDRV、MURT、MVC）的年龄差异。\n### PICO\n| 维度 | 内容 |\n|------|------|\n| P（人群） | 老年健康成人 vs 年轻健康成人 |\n| I/E（暴露） | 年龄（老年组定义因研究而异，多数 ≥ 60 岁） |\n| C（对照） | 年轻组（多数 18-30 岁） |\n| O（结局） | ①最大等长力量（MVC）；②运动单位放电率（MUDR，按收缩强度分层：>60% MVC / <30% MVC）；③放电率变异（MUDRV）；④募集阈值（MURT，以%MVC表示） |\n### 研究设计与能力边界\n- 设计：系统综述与荟萃分析（横断面研究汇总）\n- 纳入：48 项横断面设计研究\n- 检索：截至 2025 年 5 月，多个电子数据库\n- 筛选：1,493 篇记录 → 48 项研究符合纳入标准\n- 质量评估：AXIS 工具（Appraisal tool for "}, {"id": 79, "date": "2026-08-30", "author": "", "year": "2026", "title": "心理疲劳损害骑行耐力表现和努力感知，但不改变肌肉激活", "type": "解读", "journal": "", "doi": "10.1152/japplphysiol.91324.2008 |", "conclusion": "仍然不知道的：皮层脊髓兴奋性有没有变化？对力量训练有什么影响？训练有素运动员是否免疫？大脑耐力训练有没有用？心理干预能不能即时逆转效应？\n实践启示：这篇不足以改变训练实践，但让已有建议的机制解释更精确了。应对心理疲劳，走认知/心理通路，不走生理通路。\n值得追踪的问题：心理疲劳 × 抗阻训练、TMS 研究、训练水平调节效应、大脑耐力训练、认知干预的即时效果。", "full_text": "> 文献信息\n> Souron R, Sarcher A, Lacourpaille L, Boulaouche I, Richier C, Mangin T, Gruet M, Doron J, Jubeau M, Pageaux B (2026) Mental fatigue impairs cycling endurance performance and perception of effort, but not muscle activation. *Peer Community Journal*, 6: e72.\n> DOI: 10.24072/pcjournal.760 | 预印本 DOI: 10.64898/2026.03.19.712281\n> 发表于 2026-07-27 | Peer Community In Health & Movement Sciences 同行评审推荐\n> 通讯作者：Robin Souron (robin.souron@univ-nantes.fr) / Benjamin Pageaux (Université de Montréal)\n> 开放获取：CC BY 4.0 | 数据与脚本存档于 Zenodo (DOI: 10.5281/zenodo.19328889)\n---\n# 第一部分：核心文献 + 同级证据联合解读\n## 1. 研究问题\n### 这篇研究到底想解决什么问题？\n心理疲劳（Mental Fatigue）——由长时间持续投入认知活动引发的心理生理状态——已被多项研究证实会损害后续耐力表现（Van Cutsem et al. 2017; Brown et al. 2020; Pageaux & Lepers 2018）。但其神经生理学机制仍不清楚。\n一种假说认为，心理疲劳可能通过干扰运动指令（motor command）改变肌肉激活模式，进而影响表现。此前研究结果存在矛盾：Bray et al. (2008) 报告心理疲劳后握力耐力任务中肌电活动（EMG）增加；Pageaux et al. (2015) 发现骑行中股外侧肌（Vastus Lateralis）活动增加；但 Alix-Fages et al. (2023) 在等长踝背屈任务中用高密度 EMG 未检测到运动指令改变。\n本研究的核心目的是：在动态全身运动（骑行）中，用 10 块下肢肌肉的表面 EMG 系统检验心理疲劳是否改变肌肉激活。\n### PICO 框架\n| 要素 | 内容 |\n|------|------|\n| P（人群） | 18 名休闲运动参与者（8 女 / 10 男，年龄 22 ± 5 岁，身高 175 ± 12 cm，体重 68 ± 14 kg），每周 2-6 h 中等强度身体活动，无系统性骑行训练史 |\n| I（干预/暴露） "}];

  });

  if(filtered.length===0){list.innerHTML='<div class="lit-empty">无匹配文献</div>';return}

  list.innerHTML=filtered.map(function(l,i){
    return '<div class="lit-item" onclick="openModal('+l.id+')">' +
      '<div class="lit-num">'+String(i+1).padStart(2,'0')+'</div>' +
      '<div class="lit-body">' +
        '<div class="lit-meta">'+l.date+' · '+l.author+'</div>' +
        '<div class="lit-title"><span class="lit-type-tag">'+l.type+'</span>'+escHtml(l.title)+'</div>' +
        '<div class="lit-journal">'+escHtml(l.journal)+'</div>' +
        '<div class="lit-conclusion">'+escHtml(l.conclusion)+'</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function openModal(id){
  var l=LIT_DATA.find(function(x){return x.id===id});
  if(!l)return;
  var html='<div class="modal-number">#'+String(l.id).padStart(3,'0')+'</div>';
  html+='<div class="modal-title">'+escHtml(l.title)+'</div>';
  html+='<div class="modal-meta">'+l.date+' · '+escHtml(l.author)+'</div>';
  html+='<div class="modal-journal">'+escHtml(l.journal)+(l.doi?' · DOI: '+l.doi:'')+'</div>';
  if(l.full_text){
    html+='<div class="modal-section-title">文献解读</div>';
    html+='<div class="modal-text">'+escHtml(l.full_text)+'</div>';
  }
  if(l.conclusion){
    html+='<div class="modal-section-title">核心结论</div>';
    html+='<div class="modal-text">'+escHtml(l.conclusion)+'</div>';
  }
  if(l.doi){
    html+='<div class="modal-doi">DOI: <a href="https://doi.org/'+escHtml(l.doi)+'" target="_blank">'+escHtml(l.doi)+'</a></div>';
  }
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('modalOverlay')&&!e.target.classList.contains('modal-close'))return;
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow='';
}

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

renderLit();
</script>
</body>
</html>
