<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARISE CLUB</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#000000;
  --bg-card:#0A0A0A;
  --text:#FFFFFF;
  --text2:#888888;
  --text3:#555555;
  --border:#1A1A1A;
  --border-light:#2A2A2A;
}

html{scroll-behavior:smooth}
body{
  font-family:'Helvetica Neue',Arial,'PingFang SC','Noto Sans SC',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--text);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== NAV ===== */
.nav{
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:0 8vw;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}
.nav-logo{
  font-size:12px;
  font-weight:700;
  letter-spacing:3px;
  color:var(--text);
  text-transform:uppercase;
}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-user{font-size:12px;color:var(--text2);letter-spacing:.5px}
.nav-logout{
  background:none;
  border:1px solid var(--border-light);
  color:var(--text3);
  padding:5px 12px;
  border-radius:2px;
  font-size:10px;
  cursor:pointer;
  transition:all .2s;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.nav-logout:hover{border-color:var(--text2);color:var(--text2)}

/* ===== TABS ===== */
.tab-bar{
  display:flex;
  gap:0;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky;
  top:56px;
  z-index:99;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  padding:0 8vw;
}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{
  flex:0 0 auto;
  padding:14px 20px;
  font-size:11px;
  font-weight:600;
  letter-spacing:2px;
  color:var(--text3);
  background:none;
  border:none;
  border-bottom:1px solid transparent;
  cursor:pointer;
  transition:color .2s,border-color .2s;
  white-space:nowrap;
  text-transform:uppercase;
}
.tab-btn:hover{color:var(--text2)}
.tab-btn.active{color:var(--text);border-bottom-color:var(--text)}

/* ===== MAIN ===== */
.main{
  padding:80px 8vw 120px;
  max-width:1080px;
  width:100%;
  margin:0 auto;
}

/* ===== HERO ===== */
.hero{padding:100px 0 80px;border-bottom:1px solid var(--border)}
.hero-number{
  font-size:14px;
  font-weight:400;
  letter-spacing:1px;
  color:var(--text3);
  margin-bottom:32px;
}
.hero-title{
  font-size:clamp(40px,7vw,72px);
  font-weight:900;
  letter-spacing:-.03em;
  line-height:1.05;
  color:var(--text);
  margin-bottom:24px;
}
.hero-desc{
  font-size:clamp(15px,1.8vw,18px);
  font-weight:300;
  line-height:1.8;
  color:var(--text2);
  max-width:560px;
}

/* ===== SECTION LABEL ===== */
.section-label{
  font-size:10px;
  font-weight:600;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--text3);
  margin-bottom:48px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border);
}

/* ===== QUICK FACTS ===== */
.quick-facts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:32px;
  padding:48px 0;
  border-bottom:1px solid var(--border);
}
.fact-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text);
  margin-bottom:8px;
}
.fact-value{
  font-size:14px;
  font-weight:300;
  line-height:1.6;
  color:var(--text2);
}

/* ===== TAB PANELS ===== */
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ===== SERIES CARD (masterclass style) ===== */
.series-card{
  border-bottom:1px solid var(--border);
  padding:56px 0;
  display:grid;
  grid-template-columns:100px 1fr;
  gap:48px;
  align-items:start;
  transition:opacity .3s ease;
}
.series-card:hover{opacity:.85}
.series-number{
  font-size:clamp(48px,6vw,72px);
  font-weight:900;
  letter-spacing:-.04em;
  line-height:1;
  color:var(--text);
}
.series-body{padding-top:8px}
.series-title{
  font-size:clamp(22px,3vw,32px);
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.2;
  margin-bottom:8px;
}
.series-subtitle{
  font-size:13px;
  font-weight:400;
  color:var(--text2);
  letter-spacing:.5px;
  margin-bottom:16px;
}
.series-desc{
  font-size:14px;
  font-weight:300;
  line-height:1.8;
  color:var(--text3);
}

/* ===== PLACEHOLDER ===== */
.placeholder{
  padding:120px 0;
  text-align:center;
}
.placeholder-text{
  font-size:14px;
  font-weight:300;
  color:var(--text3);
  line-height:2.2;
  letter-spacing:.5px;
}

/* ===== FOOTER ===== */
.footer{
  border-top:1px solid var(--border);
  padding:40px 8vw;
  text-align:center;
  font-size:10px;
  color:var(--text3);
  letter-spacing:2px;
  text-transform:uppercase;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .main{padding:48px 6vw 80px}
  .nav{padding:0 6vw}
  .tab-bar{padding:0 6vw}
  .hero{padding:60px 0 48px}
  .series-card{grid-template-columns:1fr;gap:16px;padding:40px 0}
  .series-number{font-size:48px}
  .quick-facts{grid-template-columns:1fr;gap:24px}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">ARISE CLUB</div>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <button class="nav-logout" onclick="handleLogout()">退出</button>
  </div>
</nav>

<!-- TABS -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="literature">文献解读</button>
  <button class="tab-btn" data-tab="courses">在线课程</button>
  <button class="tab-btn" data-tab="replays">直播回放</button>
  <button class="tab-btn" data-tab="training">训练计划</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-number">//01</div>
    <div class="hero-title">发生俱乐部<br>ARISE CLUB</div>
    <div class="hero-desc">Where Strength Meets Science</div>
  </div>

  <!-- TAB 1: LITERATURE -->
  <div class="tab-panel active" id="panel-literature">
    <div class="section-label">Evidence-Based Literature Review</div>
    <div class="placeholder">
      <div class="placeholder-text">文献解读内容筹备中<br>敬请期待</div>
    </div>
  </div>

  <!-- TAB 2: COURSES -->
  <div class="tab-panel" id="panel-courses">
    <div class="section-label">Online Courses</div>
    <div class="placeholder">
      <div class="placeholder-text">在线课程内容筹备中<br>敬请期待</div>
    </div>
  </div>

  <!-- TAB 3: REPLAYS -->
  <div class="tab-panel" id="panel-replays">
    <div class="section-label">Live Session Replays</div>
    <div class="placeholder">
      <div class="placeholder-text">直播回放内容筹备中<br>敬请期待</div>
    </div>
  </div>

  <!-- TAB 4: TRAINING -->
  <div class="tab-panel" id="panel-training">
    <div class="section-label">Training Program</div>
    <div class="placeholder">
      <div class="placeholder-text">训练计划正在制作中<br>敬请期待</div>
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer class="footer">
  &copy; 2026 ARISE CLUB &middot; Where Strength Meets Science
</footer>

<script>
(function(){
  var role=localStorage.getItem('vc_role');
  if(!role){window.location.href='login.html';return}
  document.getElementById('navUser').textContent=localStorage.getItem('vc_name')||'用户';
})();
function handleLogout(){['vc_name','vc_user_id','vc_role','vc_invite_code'].forEach(function(k){localStorage.removeItem(k)});window.location.href='login.html'}

/* Tab switching */
(function(){
  var btns=document.querySelectorAll('.tab-btn'),panels=document.querySelectorAll('.tab-panel');
  btns.forEach(function(btn){btn.addEventListener('click',function(){
    btns.forEach(function(b){b.classList.remove('active')});
    panels.forEach(function(p){p.classList.remove('active')});
    btn.classList.add('active');
    var t=document.getElementById('panel-'+btn.getAttribute('data-tab'));
    if(t)t.classList.add('active');
  })});
})();
</script>
</body>
</html>
