<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARISE CLUB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#fff;
  font-family:'Helvetica Neue',Arial,'PingFang SC','Noto Sans SC',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── Number ── */
.login-number{
  font-size:12px;
  font-weight:400;
  letter-spacing:1px;
  color:#555;
  margin-bottom:40px;
}

/* ── Headline ── */
.headline{
  text-align:center;
  margin-bottom:56px;
  max-width:560px;
}
.headline-title{
  font-size:clamp(40px,8vw,72px);
  font-weight:900;
  line-height:1.05;
  letter-spacing:-.03em;
  color:#fff;
  margin-bottom:24px;
}
.headline-desc{
  font-size:clamp(14px,1.6vw,16px);
  font-weight:300;
  line-height:1.8;
  color:#888;
}

/* ── Login card ── */
.login-box{
  width:100%;
  max-width:360px;
  background:#0A0A0A;
  border:1px solid #1A1A1A;
  padding:32px 28px 28px;
}
.login-box .field{margin-bottom:20px}
.login-box label{
  display:block;
  font-size:10px;
  font-weight:600;
  letter-spacing:2.5px;
  text-transform:uppercase;
  color:#555;
  margin-bottom:8px;
}
.login-box input{
  width:100%;
  height:44px;
  background:#000;
  border:1px solid #1A1A1A;
  padding:0 14px;
  font-size:15px;
  color:#fff;
  outline:none;
  transition:border-color .2s;
  -webkit-appearance:none;
}
.login-box input:focus{border-color:#555}
.login-box input::placeholder{color:#444}
.login-box .btn{
  width:100%;
  height:48px;
  background:#fff;
  color:#000;
  font-size:13px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  border:none;
  cursor:pointer;
  margin-top:8px;
  transition:opacity .2s;
}
.login-box .btn:hover{opacity:.85}
.login-box .btn:active{opacity:.7}
.login-box .error{
  color:#888;
  font-size:12px;
  text-align:center;
  margin-top:14px;
  min-height:18px;
}

/* ── Brand footer ── */
.brand-foot{
  margin-top:48px;
  text-align:center;
}
.brand-foot .tag{
  font-size:10px;
  letter-spacing:3px;
  color:#555;
  text-transform:uppercase;
}

/* ── Responsive ── */
@media(max-width:380px){
  .headline-title{font-size:36px}
  .login-box{padding:24px 20px 22px}
}
</style>
</head>
<body>

<div class="login-number">//00</div>

<div class="headline">
  <div class="headline-title">Where Strength Meets Science<br>ARISE CLUB 发生俱乐部</div>
</div>

<div class="login-box">
  <div class="field">
    <label for="nameInput">Name</label>
    <input type="text" id="nameInput" placeholder="请输入你的姓名" autocomplete="name">
  </div>
  <div class="field">
    <label for="codeInput">Invite Code</label>
    <input type="text" id="codeInput" placeholder="请输入邀请码" autocomplete="off" style="text-transform:uppercase">
  </div>
  <button class="btn" onclick="doLogin()">Enter</button>
  <div class="error" id="errorBox"></div>
</div>

<div class="brand-foot">
  <div class="tag">ARISE CLUB &middot; Where Strength Meets Science</div>
</div>

<script>
var CODES={'VC2026A':{id:'vc001'},'VC2026B':{id:'vc002'},'VC2026C':{id:'vc003'},'COACH':{id:'coach',isCoach:true}};
(function(){if(localStorage.getItem('vc_role'))window.location.href='app.html'})();
function doLogin(){
  var n=document.getElementById('nameInput').value.trim();
  var c=document.getElementById('codeInput').value.trim().toUpperCase();
  var e=document.getElementById('errorBox');
  e.textContent='';
  if(!n){e.textContent='请输入姓名';return}
  if(!c){e.textContent='请输入邀请码';return}
  var u=CODES[c];
  if(!u){e.textContent='邀请码无效，请检查后重试';return}
  localStorage.setItem('vc_name',n);
  localStorage.setItem('vc_user_id',u.id);
  localStorage.setItem('vc_role',u.isCoach?'coach':'student');
  localStorage.setItem('vc_invite_code',c);
  window.location.href='app.html';
}
document.addEventListener('keydown',function(ev){if(ev.key==='Enter')doLogin()});
</script>
</body>
</html>
