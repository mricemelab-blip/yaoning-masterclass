<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARISE CLUB — Where Strength Meets Science</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:
    linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.55) 100%),
    url('bg.png') center center / cover no-repeat;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
}

/* ── Login Card ── */
.login-card{
  width:100%;
  max-width:320px;
  background:rgba(10,10,10,.50);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  padding:32px 24px 28px;
}

/* ── Logo: 发生俱乐部 ARISE ── */
.logo{
  text-align:center;
  margin-bottom:28px;
  padding-bottom:22px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.logo-bar{
  width:100px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.logo-bar span{
  display:block;
  height:1px;
  background:#fff;
  width:100%;
}
.logo-bar span:nth-child(2){opacity:.5}
.logo-bar + .logo-bar{margin-top:12px}
.logo-bar + .logo-bar span:nth-child(1){opacity:.5}
.logo-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:12px 0;
}
.logo-row .cn{
  font-size:14px;
  font-weight:500;
  letter-spacing:3px;
  line-height:1.7;
  color:rgba(255,255,255,.9);
}
.logo-row .en{
  font-family:Georgia,"Times New Roman",serif;
  font-size:30px;
  font-weight:400;
  letter-spacing:5px;
  color:#fff;
}

/* ── Fields ── */
.field{margin-bottom:14px}
.field label{
  display:block;
  font-size:11px;
  color:rgba(255,255,255,.4);
  margin-bottom:5px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.field input{
  width:100%;
  height:40px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:8px;
  padding:0 14px;
  font-size:14px;
  color:#fff;
  outline:none;
  transition:border-color .2s;
}
.field input:focus{border-color:rgba(255,255,255,.28)}
.field input::placeholder{color:rgba(255,255,255,.2)}

/* ── Button ── */
.btn{
  width:100%;
  height:42px;
  background:#fff;
  color:#0a0a0a;
  font-size:13px;
  font-weight:700;
  letter-spacing:3px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:6px;
  transition:opacity .2s;
  text-transform:uppercase;
}
.btn:hover{opacity:.88}
.btn:active{opacity:.75}

/* ── Error ── */
.error{
  color:#e87070;
  font-size:12px;
  text-align:center;
  margin-top:12px;
  min-height:18px;
}

/* ── Bottom Brand ── */
.brand-foot{
  margin-top:28px;
  text-align:center;
  opacity:.45;
  font-size:11px;
  letter-spacing:3px;
  color:rgba(255,255,255,.6);
}

/* ── Responsive ── */
@media(max-width:380px){
  .login-card{padding:24px 18px 22px}
  .logo-row .en{font-size:26px}
}
</style>
</head>
<body>

<div class="login-card">
  <!-- Logo: 发生俱乐部 ARISE -->
  <div class="logo">
    <div class="logo-bar"><span></span><span></span></div>
    <div class="logo-row">
      <span class="cn">发生<br>俱乐部</span>
      <span class="en">ARISE</span>
    </div>
    <div class="logo-bar"><span></span><span></span></div>
  </div>

  <div class="field">
    <label for="nameInput">姓名</label>
    <input type="text" id="nameInput" placeholder="请输入你的姓名" autocomplete="name">
  </div>
  <div class="field">
    <label for="codeInput">邀请码</label>
    <input type="text" id="codeInput" placeholder="请输入邀请码" autocomplete="off" style="text-transform:uppercase">
  </div>
  <button class="btn" onclick="doLogin()">Enter</button>
  <div class="error" id="errorBox"></div>
</div>

<div class="brand-foot">ARISE CLUB · Where Strength Meets Science</div>

<script>
var CODES={
  'VC2026A':{name:'学员A',id:'vc001'},
  'VC2026B':{name:'学员B',id:'vc002'},
  'VC2026C':{name:'学员C',id:'vc003'},
  'COACH':{name:'教练',id:'coach',isCoach:true}
};
(function(){if(localStorage.getItem('vc_role'))window.location.href='app.html'})();
function doLogin(){
  var n=document.getElementById('nameInput').value.trim();
  var c=document.getElementById('codeInput').value.trim().toUpperCase();
  var e=document.getElementById('errorBox');
  e.textContent='';
  if(!n){e.textContent='请输入姓名';return}
  if(!c){e.textContent='请输入邀请码';return}
  var u=CODES[c];
  if(!u){e.textContent='邀请码无效，请检查后重试';return}
  localStorage.setItem('vc_name',n);
  localStorage.setItem('vc_user_id',u.id);
  localStorage.setItem('vc_role',u.isCoach?'coach':'student');
  localStorage.setItem('vc_invite_code',c);
  window.location.href='app.html';
}
document.addEventListener('keydown',function(ev){if(ev.key==='Enter')doLogin()});
</script>
</body>
</html>
