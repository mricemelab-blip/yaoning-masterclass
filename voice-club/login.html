<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARISE CLUB</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#000;
  color:#fff;
  font-family:'Helvetica Neue','Arial Black',Arial,'PingFang SC','Noto Sans SC',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── Tag ── */
.tag{
  font-size:11px;
  font-weight:700;
  letter-spacing:6px;
  text-transform:uppercase;
  color:#C8F230;
  margin-bottom:48px;
}

/* ── Headline ── */
.headline{text-align:center;margin-bottom:64px}
.headline-slogan{
  font-size:clamp(28px,5vw,48px);
  font-weight:900;
  letter-spacing:-.02em;
  line-height:1.2;
  color:#C8F230;
  margin-bottom:24px;
}
.headline-cn{
  font-size:clamp(32px,6vw,56px);
  font-weight:900;
  letter-spacing:-.02em;
  line-height:1.15;
  color:#fff;
  margin-bottom:8px;
}
.headline-en{
  font-size:clamp(18px,3vw,28px);
  font-weight:400;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:rgba(255,255,255,.4);
}

/* ── Login card ── */
.login-box{
  width:100%;
  max-width:380px;
  background:#080808;
  border:1px solid #1A1A1A;
  padding:36px 32px 32px;
}
.login-box .field{margin-bottom:20px}
.login-box label{
  display:block;
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#555;
  margin-bottom:10px;
}
.login-box input{
  width:100%;
  height:48px;
  background:#000;
  border:1px solid #1A1A1A;
  padding:0 16px;
  font-size:15px;
  color:#fff;
  outline:none;
  transition:border-color .25s;
  -webkit-appearance:none;
}
.login-box input:focus{border-color:#C8F230}
.login-box input::placeholder{color:#444}
.login-box .btn{
  width:100%;
  height:52px;
  background:#C8F230;
  color:#000;
  font-size:13px;
  font-weight:800;
  letter-spacing:4px;
  text-transform:uppercase;
  border:none;
  cursor:pointer;
  margin-top:16px;
  transition:opacity .2s;
}
.login-box .btn:hover{opacity:.85}
.login-box .btn:active{opacity:.7}
.login-box .error{
  color:#888;
  font-size:12px;
  text-align:center;
  margin-top:16px;
  min-height:18px;
}

/* ── Footer ── */
.foot{
  margin-top:56px;
  text-align:center;
  font-size:10px;
  letter-spacing:3px;
  color:#444;
  text-transform:uppercase;
}
.foot span{color:#C8F230}

@media(max-width:400px){
  .headline-slogan{font-size:24px}
  .headline-cn{font-size:28px}
  .headline-en{font-size:16px}
  .login-box{padding:28px 22px 26px}
}
</style>
</head>
<body>

<div class="tag">ARISE CLUB</div>

<div class="headline">
  <div class="headline-slogan">Where Strength Meets Science</div>
  <div class="headline-cn">发生俱乐部</div>
  <div class="headline-en">Arise Club</div>
</div>

<div class="login-box">
  <div class="field">
    <label for="nameInput">Name</label>
    <input type="text" id="nameInput" placeholder="请输入你的姓名" autocomplete="name">
  </div>
  <div class="field">
    <label for="codeInput">Invite Code</label>
    <input type="text" id="codeInput" placeholder="请输入邀请码" autocomplete="off" style="text-transform:uppercase">
  </div>
  <button class="btn" onclick="doLogin()">Enter</button>
  <div class="error" id="errorBox"></div>
</div>

<div class="foot">ARISE <span>CLUB</span> &middot; Where Strength Meets Science</div>

<script>
var CODES={'VC2026A':{id:'vc001'},'VC2026B':{id:'vc002'},'VC2026C':{id:'vc003'},'COACH':{id:'coach',isCoach:true}};
(function(){if(localStorage.getItem('vc_role'))window.location.href='app.html'})();
function doLogin(){
  var n=document.getElementById('nameInput').value.trim();
  var c=document.getElementById('codeInput').value.trim().toUpperCase();
  var e=document.getElementById('errorBox');
  e.textContent='';
  if(!n){e.textContent='请输入姓名';return}
  if(!c){e.textContent='请输入邀请码';return}
  var u=CODES[c];
  if(!u){e.textContent='邀请码无效，请检查后重试';return}
  localStorage.setItem('vc_name',n);
  localStorage.setItem('vc_user_id',u.id);
  localStorage.setItem('vc_role',u.isCoach?'coach':'student');
  localStorage.setItem('vc_invite_code',c);
  window.location.href='app.html';
}
document.addEventListener('keydown',function(ev){if(ev.key==='Enter')doLogin()});
</script>
</body>
</html>
