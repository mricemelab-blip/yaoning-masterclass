<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>训练主页 — 8周女性训练</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--gold:#C5A55A;--gold-dim:rgba(197,165,90,.15);--text:#fff;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.35);--green:#22C55E;--red:#EF4444;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(197,165,90,.05) 0%,transparent 60%);pointer-events:none;z-index:0}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-size:18px;font-weight:800;color:var(--gold);letter-spacing:1px}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-week{font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-dim);padding:4px 12px;border-radius:20px;letter-spacing:1px}
.nav-user{font-size:13px;color:var(--text2)}
.nav-logout{font-size:12px;color:var(--text3);text-decoration:none;padding:4px 10px;border:1px solid var(--border);border-radius:6px;transition:all .2s}
.nav-logout:hover{color:var(--gold);border-color:var(--gold)}

/* WEEK BAR */
.week-bar{display:flex;gap:6px;padding:16px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.week-btn{flex-shrink:0;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:1px;border:1.5px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .25s}
.week-btn.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.week-btn.done{border-color:rgba(197,165,90,.4);color:var(--gold)}

/* SCENE TOGGLE */
.scene-toggle{display:flex;gap:0;margin:0 20px 16px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);position:relative;z-index:1}
.scene-btn{flex:1;padding:12px;font-size:14px;font-weight:700;letter-spacing:1px;border:none;background:transparent;color:var(--text3);cursor:pointer;transition:all .25s;font-family:inherit}
.scene-btn.active{background:var(--gold-dim);color:var(--gold)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin:0 20px;position:relative;z-index:1}
.tab-btn{flex:1;padding:12px 0;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);background:none;border:none;cursor:pointer;position:relative;transition:color .2s;font-family:inherit}
.tab-btn.active{color:var(--gold)}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:var(--gold);border-radius:1px}

/* CONTENT */
.content{padding:20px;position:relative;z-index:1;max-width:720px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700;margin-bottom:8px}
.card p{font-size:14px;color:var(--text2);line-height:1.6}

/* PHASE BADGE */
.phase-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:12px}
.phase-1{background:rgba(59,130,246,.15);color:#60A5FA}
.phase-2{background:rgba(197,165,90,.15);color:var(--gold)}
.phase-3{background:rgba(239,68,68,.15);color:#F87171}

/* DAY CARDS */
.day-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px}
.day-label{flex-shrink:0;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:0}
.day-mon{background:rgba(197,165,90,.12);color:var(--gold)}
.day-tue{background:rgba(59,130,246,.12);color:#60A5FA}
.day-wed{background:rgba(34,197,94,.12);color:#22C55E}
.day-thu{background:rgba(168,85,247,.12);color:#A855F7}
.day-fri{background:rgba(249,115,22,.12);color:#F97316}
.day-sat{background:rgba(236,72,153,.12);color:#EC4899}
.day-sun{background:rgba(255,255,255,.06);color:var(--text3)}
.day-info{flex:1;min-width:0}
.day-info h4{font-size:14px;font-weight:700;margin-bottom:2px}
.day-info p{font-size:12px;color:var(--text3)}
.day-check{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:transparent;transition:all .2s;margin-top:6px}
.day-check.done{border-color:var(--green);background:rgba(34,197,94,.15);color:var(--green)}

/* EXERCISE */
.exercise{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px}
.ex-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.ex-name{font-size:15px;font-weight:700}
.ex-sets{font-size:13px;color:var(--gold);font-weight:600;white-space:nowrap;margin-left:12px}
.ex-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ex-tag{font-size:11px;font-weight:600;padding:2px 10px;border-radius:4px;letter-spacing:.5px}
.tag-mode-flex{background:rgba(59,130,246,.12);color:#60A5FA}
.tag-mode-stab{background:rgba(34,197,94,.12);color:#22C55E}
.tag-mode-perf{background:rgba(249,115,22,.12);color:#F97316}
.tag-rest{background:rgba(255,255,255,.06);color:var(--text3)}
.ex-note{font-size:12px;color:var(--text3);margin-top:6px}

/* PRINCIPLE */
.principle{background:linear-gradient(135deg,rgba(197,165,90,.08),rgba(197,165,90,.02));border:1px solid rgba(197,165,90,.2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.principle h4{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:1px;margin-bottom:8px}
.principle p{font-size:13px;color:var(--text2);line-height:1.6}

/* CHECKIN BUTTON */
.checkin-btn{width:100%;padding:16px;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .25s;font-family:inherit;margin-top:20px}
.checkin-btn.pending{background:var(--gold);color:#fff}
.checkin-btn.pending:hover{background:#B8960C}
.checkin-btn.completed{background:rgba(34,197,94,.12);color:var(--green);border:1.5px solid rgba(34,197,94,.3);cursor:default}

/* NUTRITION */
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.macro-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.macro-val{font-size:24px;font-weight:800;color:var(--gold)}
.macro-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.meal-plan{margin-top:16px}
.meal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.meal-row:last-child{border-bottom:none}
.meal-name{font-weight:700;color:var(--text)}
.meal-detail{color:var(--text3);text-align:right;max-width:55%}

/* SUPPLEMENT */
.supp-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px}
.supp-header{display:flex;justify-content:space-between;align-items:center}
.supp-name{font-size:15px;font-weight:700}
.supp-evidence{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.5px}
.evidence-a{background:rgba(34,197,94,.15);color:#22C55E}
.evidence-b{background:rgba(197,165,90,.15);color:var(--gold)}
.evidence-c{background:rgba(255,255,255,.08);color:var(--text3)}
.supp-detail{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px}
.supp-detail dt{color:var(--text3)}
.supp-detail dd{color:var(--text2)}
.supp-note{font-size:12px;color:var(--text3);margin-top:8px;font-style:italic}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty h3{font-size:16px;margin-bottom:8px;color:var(--text2)}

/* RESPONSIVE */
@media(max-width:480px){
.content{padding:16px}
.card{padding:18px}
.macro-grid{grid-template-columns:1fr 1fr}
.scene-toggle{margin:0 16px 12px}
.week-bar{padding:12px 16px}
.tabs{margin:0 16px}
.nav{padding:0 16px}
.nav-user{display:none}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(197,165,90,.2);border-radius:2px}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">

// ===== FUNCTIONS =====
function calcWeek() {
  var now = new Date();
  var diff = Math.floor((now - startDate) / (7*24*60*60*1000));
  return Math.max(1, Math.min(8, diff + 1));
}

function getDayOfWeek() {
  var d = new Date().getDay();
  return d; // 0=Sun,1=Mon,...,6=Sat
}

function getPhaseData(w, scene) {
  if (w === 8) return P3_TEST[scene];
  var pool = w <= 2 ? P1 : (w <= 5 ? P2 : P3);
  return pool[scene];
}

var DAY_MAP = { 1: 'Lower A', 2: 'Upper A', 3: 'Cardio', 4: 'Lower B', 5: 'Upper B', 6: 'Saturday', 0: 'Rest' };

function getTodayKey() {
  return DAY_MAP[getDayOfWeek()];
}

function getCheckinKey(w, dayOfWeek) {
  return 'w' + w + 'd' + dayOfWeek;
}

function isCheckinDone(w, dayOfWeek) {
  return !!state.checkins[getCheckinKey(w, dayOfWeek)];
}

function toggleCheckin(w, dayOfWeek) {
  var key = getCheckinKey(w, dayOfWeek);
  if (state.checkins[key]) {
    delete state.checkins[key];
  } else {
    state.checkins[key] = { time: new Date().toISOString() };
  }
  localStorage.setItem('wt_checkins', JSON.stringify(state.checkins));
  state.checkins = JSON.parse(localStorage.getItem('wt_checkins') || '{}');
}

// ===== INIT =====
function init() {
  // Nav
  document.getElementById('navUser').textContent = state.userName || '';
  var cw = calcWeek();
  state.currentWeek = cw;
  document.getElementById('navWeek').textContent = 'Week ' + cw + ' / 8';

  // Week bar
  var wb = document.getElementById('weekBar');
  wb.innerHTML = '';
  for (var i = 1; i <= 8; i++) {
    var btn = document.createElement('button');
    btn.className = 'week-btn' + (i === cw ? ' active' : '') + (i < cw ? ' done' : '');
    btn.textContent = 'W' + i;
    btn.setAttribute('data-week', i);
    btn.onclick = (function(w){ return function(){ state.currentWeek = w; updateAll(); }; })(i);
    wb.appendChild(btn);
  }

  // Scene
  var sbtns = document.querySelectorAll('.scene-btn');
  sbtns.forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-scene') === state.currentScene); });

  // Render
  renderAll();
}

function setScene(s) {
  state.currentScene = s;
  localStorage.setItem('wt_scene', s);
  document.querySelectorAll('.scene-btn').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-scene') === s); });
  renderAll();
}

function setTab(t) {
  state.currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-tab') === t); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('panel-' + t).classList.add('active');
  renderAll();
}

function doLogout() {
  localStorage.removeItem('wt_role');
  localStorage.removeItem('wt_user_id');
  localStorage.removeItem('wt_user_name');
  localStorage.removeItem('wt_invite_code');
  localStorage.removeItem('wt_profile');
  localStorage.removeItem('wt_start_date');
  localStorage.removeItem('wt_checkins');
  localStorage.removeItem('wt_scene');
}

function updateAll() {
  // Week bar
  document.querySelectorAll('.week-btn').forEach(function(b) {
    var w = parseInt(b.getAttribute('data-week'));
    b.className = 'week-btn' + (w === state.currentWeek ? ' active' : '') + (w < state.currentWeek ? ' done' : '');
  });
  document.getElementById('navWeek').textContent = 'Week ' + state.currentWeek + ' / 8';
  renderAll();
}

function renderAll() {
  renderOverview();
  renderToday();
  renderNutrition();
  renderSupplements();
}

// ===== RENDER: OVERVIEW =====
function renderOverview() {
  var w = state.currentWeek;
  var phase = getPhase(w);
  var data = getPhaseData(w, state.currentScene);
  var dayKeys = ['Lower A','Upper A','Cardio','Lower B','Upper B','Saturday','Rest'];
  var dayNames = ['周一','周二','周三','周四','周五','周六','周日'];
  var dayClasses = ['day-mon','day-tue','day-wed','day-thu','day-fri','day-sat','day-sun'];

  var html = '';
  html += '<div class="phase-badge ' + phase.cls + '">' + phase.name + '</div>';
  html += '<div class="card"><div class="card-title">阶段目标</div><h3>' + phase.goal + '</h3>';
  html += '<p style="margin-top:8px;color:var(--gold);font-size:13px">强度：' + phase.intensity + '</p></div>';

  html += '<div class="card"><div class="card-title">本周训练概览</div>';
  dayKeys.forEach(function(dk, idx) {
    var info = dk === 'Cardio' ? CARDIO : (dk === 'Rest' ? REST : (data[dk] || { focus: '—' }));
    var cw = calcWeek();
    var dow = idx + 1; if (idx === 6) dow = 0;
    var done = isCheckinDone(w, dow);
    html += '<div class="day-card">';
    html += '<div class="day-label ' + dayClasses[idx] + '">' + dayNames[idx] + '</div>';
    html += '<div class="day-info"><h4>' + info.focus + '</h4><p>' + (info.exercises ? info.exercises.length + ' 个动作' : '') + '</p></div>';
    html += '<div class="day-check ' + (done ? 'done' : '') + '" title="打卡">✓</div>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="principle"><h4>⚡ 训练原则</h4>';
  html += '<p><strong>机械张力 = 力 × 时间 × 肌纤维募集数</strong></p>';
  html += '<p style="margin-top:6px">骨骼适应的关键不是"动了多少"，而是骨骼承受的应变量(strain)是否超过最小有效阈值(MES, ~1500με)。高负荷、多方向的力学刺激是骨密度提升的核心驱动力。</p></div>';

  html += '<div class="card"><div class="card-title">营养策略</div><p>' + phase.nutrition + '</p></div>';

  document.getElementById('panel-overview').innerHTML = html;
}

// ===== RENDER: TODAY =====
function renderToday() {
  var w = state.currentWeek;
  var dow = getDayOfWeek();
  var dayKey = getTodayKey();
  var html = '';

  html += '<div class="card-title" style="margin-bottom:12px">Week ' + w + ' · ' + ['周日','周一','周二','周三','周四','周五','周六'][dow] + '</div>';

  if (dayKey === 'Cardio') {
    html += renderExerciseGroup(CARDIO);
    var ck = isCheckinDone(w, 3);
    html += '<button class="checkin-btn ' + (ck ? 'completed' : 'pending') + '" onclick="doCheckin(3)">' + (ck ? '✓ 今日已完成' : '完成打卡') + '</button>';
  } else if (dayKey === 'Rest') {
    html += renderExerciseGroup(REST);
    var ck = isCheckinDone(w, 0);
    html += '<button class="checkin-btn ' + (ck ? 'completed' : 'pending') + '" onclick="doCheckin(0)">☀ 休息日</button>';
  } else {
    var data = getPhaseData(w, state.currentScene);
    var session = data[dayKey];
    if (session) {
      html += '<div class="card" style="margin-bottom:16px"><div class="card-title">' + session.day + '</div><h3>' + session.focus + '</h3></div>';
      session.exercises.forEach(function(ex) {
        html += renderExercise(ex);
      });
      var ck = isCheckinDone(w, dow);
      html += '<button class="checkin-btn ' + (ck ? 'completed' : 'pending') + '" onclick="doCheckin(' + dow + ')">' + (ck ? '✓ 今日训练已完成' : '完成今日训练打卡') + '</button>';
    } else {
      html += '<div class="empty"><h3>今日无训练安排</h3></div>';
    }
  }

  document.getElementById('panel-today').innerHTML = html;
}

function renderExercise(ex) {
  var modeClass = ex.mode === 'flex' ? 'tag-mode-flex' : (ex.mode === 'stab' ? 'tag-mode-stab' : 'tag-mode-perf');
  var modeText = ex.mode === 'flex' ? '灵活力量' : (ex.mode === 'stab' ? '稳定力量' : '运动表现');
  var h = '<div class="exercise">';
  h += '<div class="ex-header"><span class="ex-name">' + ex.name + '</span><span class="ex-sets">' + ex.sets + '</span></div>';
  h += '<div class="ex-meta">';
  h += '<span class="ex-tag ' + modeClass + '">' + modeText + '</span>';
  if (ex.rest && ex.rest !== '—') h += '<span class="ex-tag tag-rest">休息 ' + ex.rest + '</span>';
  if (ex.type) h += '<span class="ex-tag tag-rest">' + ex.type + '</span>';
  h += '</div>';
  if (ex.note) h += '<p class="ex-note">' + ex.note + '</p>';
  h += '</div>';
  return h;
}

function renderExerciseGroup(session) {
  var h = '<div class="card" style="margin-bottom:16px"><div class="card-title">' + session.day + '</div><h3>' + session.focus + '</h3></div>';
  session.exercises.forEach(function(ex) { h += renderExercise(ex); });
  return h;
}

function doCheckin(dow) {
  var w = state.currentWeek;
  var key = getCheckinKey(w, dow);
  if (state.checkins[key]) return; // already done
  toggleCheckin(w, dow);
  renderToday();
  renderOverview();
}

// ===== RENDER: NUTRITION =====
function renderNutrition() {
  var p = state.profile;
  var html = '';

  if (!p || !p.weight || !p.height || !p.age) {
    html = '<div class="empty"><h3>请先完成问卷</h3><p>营养方案需要根据您的身体数据计算</p></div>';
    document.getElementById('panel-nutrition').innerHTML = html;
    return;
  }

  var weightKg = parseFloat(p.weight);
  var heightCm = parseFloat(p.height);
  var age = parseInt(p.age);
  var weightLbs = weightKg * 2.205;

  // BMR Mifflin-St Jeor Female
  var bmr = 10 * weightKg + 6.25 * heightCm - 5 * age - 161;

  // Activity factor
  var freq = parseInt(p.trainingFreq) || 3;
  var af = 1.2;
  if (freq === 0) af = 1.2;
  else if (freq <= 2) af = 1.375;
  else if (freq <= 4) af = 1.55;
  else af = 1.725;

  var tdee = Math.round(bmr * af);
  bmr = Math.round(bmr);

  // Phase adjustment
  var w = state.currentWeek;
  var multiplier = 1;
  var strategy = '';
  if (w <= 2) { multiplier = 1; strategy = '维持热量'; }
  else if (w <= 5) { multiplier = 0.9; strategy = '轻度减脂'; }
  else { multiplier = 1.1; strategy = '微盈余增肌'; }

  var targetCal = Math.round(tdee * multiplier);

  // Macros
  var proteinG = Math.round(weightLbs * 1.1); // midpoint 1.0-1.2
  var carbG = Math.round((targetCal * 0.4) / 4);
  var fatG = Math.round((targetCal * 0.25) / 9);

  html += '<div class="phase-badge ' + getPhase(w).cls + '">' + getPhase(w).name + ' · ' + strategy + '</div>';

  html += '<div class="card"><div class="card-title">基础代谢</div>';
  html += '<div class="macro-grid">';
  html += '<div class="macro-item"><div class="macro-val">' + bmr + '</div><div class="macro-label">BMR kcal</div></div>';
  html += '<div class="macro-item"><div class="macro-val">' + tdee + '</div><div class="macro-label">TDEE kcal</div></div>';
  html += '</div></div>';

  html += '<div class="card"><div class="card-title">每日目标</div>';
  html += '<div class="macro-grid">';
  html += '<div class="macro-item"><div class="macro-val">' + targetCal + '</div><div class="macro-label">目标热量 kcal</div></div>';
  html += '<div class="macro-item"><div class="macro-val">' + proteinG + 'g</div><div class="macro-label">蛋白质</div></div>';
  html += '<div class="macro-item"><div class="macro-val">' + carbG + 'g</div><div class="macro-label">碳水化合物</div></div>';
  html += '<div class="macro-item"><div class="macro-val">' + fatG + 'g</div><div class="macro-label">脂肪</div></div>';
  html += '</div>';
  html += '<p style="font-size:12px;color:var(--text3);margin-top:8px">蛋白质 ' + proteinG + 'g × 4 = ' + (proteinG*4) + ' kcal | 碳水 ' + carbG + 'g × 4 = ' + (carbG*4) + ' kcal | 脂肪 ' + fatG + 'g × 9 = ' + (fatG*9) + ' kcal</p>';
  html += '</div>';

  // Meal template
  var proteinPerMeal = Math.round(proteinG / 4);
  var carbPerMeal = Math.round(carbG / 4);

  html += '<div class="card"><div class="card-title">4餐模板</div>';
  html += '<div class="meal-plan">';
  html += mealRow('早餐 7-8am', '鸡蛋2个 + 燕麦50g + 莓果 + ' + proteinPerMeal + 'g 蛋白');
  html += mealRow('午餐 12pm', '鸡胸/鱼150g + 糙米/红薯 + 蔬菜');
  html += mealRow('训练前 4pm', '香蕉 + 全麦面包 + 蛋白粉（可选）');
  html += mealRow('晚餐 7pm', '瘦牛肉/三文鱼150g + 蔬菜 + 适量主食');
  html += '</div>';
  html += '<p style="font-size:12px;color:var(--text3);margin-top:12px">每餐约 ' + proteinPerMeal + 'g 蛋白质 · ' + carbPerMeal + 'g 碳水</p>';
  html += '</div>';

  html += '<div class="principle"><h4>💡 营养原则</h4>';
  html += '<p>骨骼重建需要充足的蛋白质作为胶原基质，同时需要钙、维生素D、维生素K2协同作用。训练日营养围绕训练窗口分配，非训练日均匀分配即可。</p></div>';

  document.getElementById('panel-nutrition').innerHTML = html;
}

function mealRow(name, detail) {
  return '<div class="meal-row"><span class="meal-name">' + name + '</span><span class="meal-detail">' + detail + '</span></div>';
}

  if (needIron) {
    html += suppCard('铁蛋白检测提醒', '—', '—',
      '疲劳和能量下降可能与铁缺乏相关，建议进行血清铁蛋白(ferritin)检测。女性运动员铁缺乏率高。', 'C',
      '切勿盲目补铁，需先检测确认');
  }

  // General
  html += suppCard('Omega-3 鱼油', '1-2g EPA+DHA / 天', '随餐服用',
    '抗炎、支持关节健康和心血管功能', 'B',
    '选择IFOS认证产品');

  html += '<div class="principle" style="margin-top:20px"><h4>⚠️ 重要提示</h4>';
  html += '<p>补剂是"补充"而非"替代"。优先通过均衡饮食获取营养。所有补剂建议在使用前咨询医疗专业人员，特别是存在基础疾病或服用药物的情况。</p></div>';

  document.getElementById('panel-supplements').innerHTML = html;
}

function suppCard(name, dose, timing, effect, evidence, note) {
  var evClass = evidence === 'A' ? 'evidence-a' : (evidence === 'B' ? 'evidence-b' : 'evidence-c');
  var h = '<div class="supp-item">';
  h += '<div class="supp-header"><span class="supp-name">' + name + '</span><span class="supp-evidence ' + evClass + '">证据等级 ' + evidence + '</span></div>';
  h += '<dl class="supp-detail">';
  h += '<dt>剂量</dt><dd>' + dose + '</dd>';
  h += '<dt>时间</dt><dd>' + timing + '</dd>';
  h += '<dt>作用</dt><dd>' + effect + '</dd>';
  h += '</dl>';
  if (note) h += '<p class="supp-note">' + note + '</p>';
  h += '</div>';
  return h;
}

// ===== BOOT =====
init();
</script>
